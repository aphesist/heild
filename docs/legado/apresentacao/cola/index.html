<style>
/* Teleprompter de bolso: uma tela por slide, texto grande, marcações de palco coloridas. Escuro por escolha (palco). */
:root {
  --bg: #0c0d10;
  --bg-2: #15171c;
  --bg-3: #1e2128;
  --fg: #f3f2ee;
  --muted: #9ba1ab;
  --line: #2a2e36;
  --clique: #7cc4ff;
  --pausa: #f3c56d;
  --avanca: #7fe0a8;
  --entender: #c7b8ff;
  --late: #ff8a7a;
  --font: "Atkinson Hyperlegible", -apple-system, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --fs: 21px;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font);
  font-size: var(--fs); line-height: 1.55; -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: contain;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--clique); outline-offset: 2px; border-radius: 8px; }

/* Topo */
.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 0; border-bottom: 1px solid var(--line);
}
.topo-linha { display: flex; align-items: center; gap: 12px; }
.num { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.num b { color: var(--fg); font-size: 22px; }
.titulos { flex: 1; min-width: 0; }
.secao { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titulo { font-size: 18px; font-weight: 700; line-height: 1.25; text-wrap: balance; }
.relogio { text-align: right; font-variant-numeric: tabular-nums; padding: 4px 2px; }
.relogio .t { font-size: 20px; font-weight: 700; display: block; }
.relogio .d { font-size: 12px; color: var(--muted); display: block; }
.relogio .d.atrasado { color: var(--late); }
.relogio.parado .t { color: var(--muted); }
.meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding: 6px 0 8px; }
.meta .c { color: var(--clique); }
.barra { height: 3px; background: var(--bg-3); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
.barra i { display: block; height: 100%; background: var(--fg); width: 0; transition: width .3s; }

/* Texto */
main {
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(110px + env(safe-area-inset-bottom, 0px));
  max-width: 44rem; margin: 0 auto;
}
.fala p, .fala li { margin: 0 0 .9em; }
.fala ul { padding-left: 1.1em; margin: 0 0 .9em; }
.fala strong { color: #fff; background: linear-gradient(transparent 62%, rgba(124,196,255,.18) 62%); }
.so-mk { margin: .2em 0 1em !important; }
/* o que não é fala (indicações de cena) fica menor, em itálico e apagado */
.fala em { font-style: italic; font-size: .8em; color: var(--muted); opacity: .75; }
.fala strong em { color: var(--muted); background: none; }
.mk {
  display: inline-block; font-size: .72em; font-weight: 700; letter-spacing: .06em; line-height: 1;
  padding: .42em .7em; border-radius: 999px; vertical-align: .12em; margin: 0 .15em; white-space: nowrap;
}
.mk-clique { color: #08131d; background: var(--clique); }
.mk-pausa { color: #1d1504; background: var(--pausa); }
.mk-avanca { color: #06190e; background: var(--avanca); }
body.curta .fala p:not(.chave):not(.so-mk), body.curta .fala li:not(.chave) { display: none; }
body.curta .fala ul:not(:has(li.chave)) { display: none; }

details.entender { margin-top: 22px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; font-size: .86em; }
details.entender summary { color: var(--entender); font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
details.entender summary::-webkit-details-marker { display: none; }
details.entender summary::after { content: "+"; font-size: 1.2em; line-height: 1; }
details.entender[open] summary::after { content: "–"; }
details.entender p { margin: .7em 0 0; color: #dcdad3; }

/* Páginas de apoio */
.apoio h3, .apoio h2 { font-size: 1.05em; margin: 1.4em 0 .5em; }
.apoio p, .apoio li { margin: 0 0 .8em; }
.apoio table { border-collapse: collapse; font-size: .78em; width: 100%; }
.apoio .tab { overflow-x: auto; margin-bottom: 1em; }
.apoio th, .apoio td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.apoio code { font-size: .85em; background: var(--bg-3); padding: .1em .35em; border-radius: 5px; }

/* Barra inferior */
.controles {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(12,13,16,.94);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
  padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: 1.3fr auto auto auto 1.3fr; gap: 8px; align-items: stretch;
}
.controles button { background: var(--bg-3); border-radius: 14px; min-height: 56px; padding: 0 12px; font-size: 15px; font-weight: 700; }
.controles .nav { font-size: 30px; font-weight: 400; }
.controles .modo[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* Menu */
.menu { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.menu-topo { display: flex; gap: 8px; align-items: center; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.menu-topo .abas { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
.menu-topo button { background: var(--bg-3); border-radius: 999px; padding: 8px 14px; font-size: 15px; }
.menu-topo button[aria-selected="true"] { background: var(--fg); color: var(--bg); }
.menu-corpo { overflow-y: auto; flex: 1; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.lista-secao { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
.lista button { display: flex; width: 100%; gap: 12px; text-align: left; padding: 11px 6px; border-bottom: 1px solid var(--line); font-size: 17px; }
.lista button .n { color: var(--muted); width: 2.2em; flex: none; font-variant-numeric: tabular-nums; }
.lista button.atual { color: var(--clique); }
.opcoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.opcoes button { background: var(--bg-3); border-radius: 12px; padding: 10px 14px; font-size: 15px; }
@media (prefers-reduced-motion: reduce) { .barra i { transition: none; } }
</style>

<script>
const D = {"inicio": "<p><strong>Duas durações no mesmo texto.<\/strong><\/p>\n<ul>\n<li><strong>Versão curta (~28 min, a meta do evento):<\/strong> diga só as frases em <strong>negrito<\/strong> de cada FALA e dê todos os cliques mesmo assim (os builds precisam passar). Lidas em sequência, as frases em negrito contam a história inteira.<\/li>\n<li><strong>Versão completa (~69 min + perguntas):<\/strong> diga a FALA inteira.<\/li>\n<\/ul>\n<p><strong>O tom.<\/strong> Frases curtas. Uma ideia por vez. Diga o número e pare. Contraste sempre \"o jeito de hoje\" com \"o nosso jeito\". Deixe o clique fazer a revelação: fale depois que a coisa aparece, não antes. Entusiasmo de quem construiu, não de quem vende. O \"e tem mais uma coisa\" aparece uma vez só, no slide 15. Não gaste antes.<\/p>\n<p><strong>Legenda das marcações<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Marcação<\/th>\n<th>O que fazer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>[PAUSA]<\/code><\/td>\n<td>Pare 2 segundos. Respire. Deixe o número ou a frase assentar antes de seguir.<\/td>\n<\/tr>\n<tr>\n<td><code>[CLIQUE n]<\/code><\/td>\n<td>Dê o clique de número n do slide: entra o build seguinte. A numeração recomeça em cada slide e bate com os <code>data-step<\/code> dos arquivos em <code>src/slides/<\/code>.<\/td>\n<\/tr>\n<tr>\n<td><code>[AVANÇA]<\/code><\/td>\n<td>Último clique: passa para o próximo slide.<\/td>\n<\/tr>\n<tr>\n<td>Texto em itálico entre parênteses<\/td>\n<td>Indicação de cena, o que aparece na tela ou lembrete para o Enzo. Não se lê em voz alta.<\/td>\n<\/tr>\n<tr>\n<td><strong>Negrito<\/strong><\/td>\n<td>Ênfase na fala e, ao mesmo tempo, o texto da versão curta.<\/td>\n<\/tr>\n<tr>\n<td>⏱<\/td>\n<td>Tempo da versão completa · tempo da versão curta · número de cliques antes do <code>[AVANÇA]<\/code>.<\/td>\n<\/tr>\n<tr>\n<td>Para você entender<\/td>\n<td>Quadro no fim de cada slide, só para o Enzo. Não é para ser lido em voz alta.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Tempo por seção<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Seção<\/th>\n<th>Slides<\/th>\n<th style=\"text-align: right;\">Completa<\/th>\n<th style=\"text-align: right;\">Curta<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Abertura<\/td>\n<td>1–2<\/td>\n<td style=\"text-align: right;\">1:30<\/td>\n<td style=\"text-align: right;\">1:00<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>O problema<\/td>\n<td>3–6<\/td>\n<td style=\"text-align: right;\">4:30<\/td>\n<td style=\"text-align: right;\">2:00<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Mercado e concorrentes<\/td>\n<td>7–9<\/td>\n<td style=\"text-align: right;\">3:00<\/td>\n<td style=\"text-align: right;\">1:00<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>A solução<\/td>\n<td>10–12<\/td>\n<td style=\"text-align: right;\">3:30<\/td>\n<td style=\"text-align: right;\">1:30<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>O que há de novo<\/td>\n<td>13–16<\/td>\n<td style=\"text-align: right;\">6:30<\/td>\n<td style=\"text-align: right;\">3:00<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Arquitetura em 4 camadas<\/td>\n<td>17–21<\/td>\n<td style=\"text-align: right;\">5:00<\/td>\n<td style=\"text-align: right;\">1:50<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>A cascata de recuperação<\/td>\n<td>22–32<\/td>\n<td style=\"text-align: right;\">10:30<\/td>\n<td style=\"text-align: right;\">3:40<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Confiança e melhoria contínua<\/td>\n<td>33–36<\/td>\n<td style=\"text-align: right;\">4:40<\/td>\n<td style=\"text-align: right;\">1:40<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Ingestão da base legal<\/td>\n<td>37–47<\/td>\n<td style=\"text-align: right;\">10:00<\/td>\n<td style=\"text-align: right;\">3:00<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Visão agêntica e diferenciais<\/td>\n<td>48–49<\/td>\n<td style=\"text-align: right;\">2:30<\/td>\n<td style=\"text-align: right;\">1:00<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>Segurança, LGPD e responsabilidade<\/td>\n<td>50–51<\/td>\n<td style=\"text-align: right;\">2:00<\/td>\n<td style=\"text-align: right;\">1:00<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>Plano e investimento<\/td>\n<td>52–54<\/td>\n<td style=\"text-align: right;\">3:30<\/td>\n<td style=\"text-align: right;\">1:40<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>GPU e custo por pergunta<\/td>\n<td>55–58<\/td>\n<td style=\"text-align: right;\">4:00<\/td>\n<td style=\"text-align: right;\">1:30<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>Preço e escala<\/td>\n<td>59–62<\/td>\n<td style=\"text-align: right;\">3:30<\/td>\n<td style=\"text-align: right;\">1:30<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Riscos, aporte e encerramento<\/td>\n<td>63–65<\/td>\n<td style=\"text-align: right;\">4:00<\/td>\n<td style=\"text-align: right;\">2:30<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>Total<\/strong><\/td>\n<td><strong>65<\/strong><\/td>\n<td style=\"text-align: right;\"><strong>~68:40<\/strong><\/td>\n<td style=\"text-align: right;\"><strong>~27:50<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Depois: 15 a 20 minutos de perguntas (seção no fim deste arquivo).<\/p>\n<h3>Cinco dicas de palco para quem não é contador<\/h3>\n<ol>\n<li><strong>Quando não souber, devolva a pergunta ao grupo.<\/strong> \"Boa pergunta. Como vocês fazem isso hoje no escritório?\" Eles são os especialistas, e você está ali para construir a ferramenta com eles, não para dar aula de tributação.<\/li>\n<li><strong>Nunca improvise número nem artigo de lei.<\/strong> Se o número não está no slide ou neste roteiro, diga: \"Não tenho esse número aqui. Anoto e mando para vocês.\" É exatamente o que o produto promete: abstenção em vez de invenção. Faça no palco o que o sistema faz.<\/li>\n<li><strong>Os exemplos dos slides são ilustrativos e foram conferidos, mas peça validação.<\/strong> Frase pronta: \"Esse exemplo foi conferido, mas quem dá a palavra final aqui são vocês.\"<\/li>\n<li><strong>Fale na língua do escritório, não na da tecnologia.<\/strong> Diga o nome técnico uma vez, logo depois a analogia, e daí em diante use só a analogia (\"o revisor\", \"a gaveta\", \"o office boy\").<\/li>\n<li><strong>Assuma que é uma pessoa só.<\/strong> Não esconda isso. A força da proposta é um escopo bem cortado, agentes de programação e o grupo de contadores medindo tudo. Dizer \"eu\" com tranquilidade passa mais confiança do que um \"nós\" vago.<\/li>\n<\/ol>\n<hr />", "perguntas": "<p>Respostas curtas, honestas e baseadas no plano. Quando a resposta não está no plano, está marcado <strong>[a combinar]<\/strong>: diga isso com tranquilidade.<\/p>\n<p><strong>1. Se a resposta estiver errada e meu cliente for autuado, quem responde?<\/strong>\nQuem assina é o contador com CRC; o produto é um assistente, não substitui o profissional. O que eu faço é reduzir o risco e deixar tudo rastreável: toda resposta mostra a fonte e a data de vigência, registro qual versão da base gerou cada resposta, e publico a taxa de erro medida. Seguro de responsabilidade profissional entra a partir de 500 usuários.<\/p>\n<p><strong>2. Meus dados e os dos meus clientes ficam seguros? E a LGPD?<\/strong>\nCada escritório fica cifrado e isolado, com registro de acesso. Nada é usado para treinar modelos. A pergunta vai ao modelo de IA fora do país, com as cláusulas-padrão da ANPD, e o fornecedor não guarda nem treina com ela. Termos de uso e LGPD ficam prontos antes de qualquer cobrança.<\/p>\n<p><strong>3. De onde vem a lei? Vocês copiam das editoras?<\/strong>\nNão. Só fontes oficiais: Diário Oficial (INLABS), Planalto, LexML, Receita, CARF, CONFAZ, Sefaz, diários municipais, Mediador do MTE e Juntas. Compilação de editora tem direito autoral e serve só para conferência manual.<\/p>\n<p><strong>4. E se a IA errar?<\/strong>\nTrês travas. Antes de entregar, cada citação passa por três perguntas: existe, valia na data, diz o que se afirma. Sem prova, o sistema responde \"não encontrei base legal\". E quando mesmo assim errar, você clica em \"incorreta\", corrige, e isso vira um caso de teste que nenhuma versão futura pode reprovar.<\/p>\n<p><strong>5. Isso tudo é experimental. E se não funcionar?<\/strong>\nEntão não entra. Cada técnica nova disputa no benchmark, com as perguntas de vocês, contra o método clássico que já funciona (busca por palavra, filtro de vigência, citação conferida). Se perder, fica desligada por uma chave, e o custo não muda. O que nunca é experimental: a base legal, as calculadoras e a conferência das citações.<\/p>\n<p><strong>6. Por que arriscar com técnicas tão novas, em vez de usar o que já é testado?<\/strong>\nPorque o que já é testado é o que os 18 concorrentes fazem, e é justamente o que erra com lei: traz a redação errada, o texto revogado, não segue remissão. As técnicas novas foram publicadas em conferências científicas com revisão (ICLR, COLM) e atacam esses problemas um por um. E o risco é controlado: só entra o que vence, com aprovação humana. No pior caso, vocês ficam com o método clássico.<\/p>\n<p><strong>7. O que é a DGM, em uma frase?<\/strong>\nSeleção natural aplicada ao código do agente: cada nova versão lê os próprios erros, propõe uma mudança, faz a prova com as perguntas de vocês, e só fica se acertar mais. Se pedirem mais: é de 2025, de pesquisadores da UBC, do Vector Institute e da Sakana AI, aceita no ICLR 2026, e levou um agente de programação de 20% para 50% no SWE-bench.<\/p>\n<p><strong>8. A DGM pode \"aprender errado\" ou mexer na lei sozinha?<\/strong>\nNão na lei: a base legal, as calculadoras e as regras de segurança ficam fora da área que ela pode editar. Contra \"aprender errado\", ou burlar a prova, que o próprio artigo relata: um conjunto reservado de perguntas que ela nunca vê, métrica que pune erro e omissão, auditoria humana por amostra, execução isolada e a versão anterior pronta para voltar. E nada vai ao ar sem uma pessoa aprovar.<\/p>\n<p><strong>9. Por que eu pagaria se já tenho o ChatGPT?<\/strong>\nO ChatGPT não sabe qual redação valia em 2022, não confere a citação e não foi feito para dizer \"não sei\". O exemplo do slide 6 é o tipo de erro que ele comete: lei revogada e artigo inventado. Aqui a diferença é data do fato, citação conferida e cálculos feitos por calculadora.<\/p>\n<p><strong>10. Quanto custa para mim?<\/strong>\nAgora, no desenvolvimento: a sua parte do aporte de R$ 20 mil, dividido entre os escritórios do grupo (se forem 10 escritórios, por exemplo, R$ 2 mil cada). Depois do lançamento: Individual R$ 199/mês, Escritório R$ 790/mês para 5 usuários. Condição especial para quem financiou: <strong>[a combinar com o grupo]<\/strong>.<\/p>\n<p><strong>11. O que eu ganho sendo playtester?<\/strong>\nUsa o sistema desde o começo, molda o produto com as suas perguntas e decide quais agentes vêm primeiro (a lista de tarefas que você quer delegar). Benefícios comerciais, como desconto ou acesso no lançamento, <strong>[a combinar com o grupo]<\/strong>: prefiro decidir com vocês a prometer aqui.<\/p>\n<p><strong>12. Como fica o aporte? Para quem eu pago? Que garantia eu tenho?<\/strong>\nOs gastos são pagos no meu cartão de pessoa física, porque sai 40% mais barato que via CNPJ (R$ 5,69 contra R$ 7,97 por dólar); o CNPJ é aberto no fim do desenvolvimento. A forma jurídica do aporte (doação para desenvolvimento, pré-pagamento de assinatura, participação) e a prestação de contas mês a mês <strong>[a combinar com o grupo]<\/strong>. Há limite mensal de gasto e alerta, e uma ordem de corte definida.<\/p>\n<p><strong>13. E se faltar dinheiro?<\/strong>\nTem reserva de cerca de 12%. Se passar disso, a ordem de corte já está definida: primeiro o 3º ciclo da DGM, depois a 2ª rodada de treino da política de busca, depois o doc2query completo. O que é essencial para o portão final não entra no corte.<\/p>\n<p><strong>14. E se sobrar dinheiro?<\/strong>\nÉ possível, principalmente se os créditos de API do Claude Ultra se confirmarem. O destino da sobra <strong>[a combinar com o grupo]<\/strong>.<\/p>\n<p><strong>15. Qual é o prazo? Quando eu uso de verdade?<\/strong>\nVocê participa desde o começo: manda perguntas com gabarito, usa o alfa assim que existir e, antes do fim dos seis meses, já usa como se estivesse lançado. Lançamento comercial no mês 7. O detalhe está no slide 52.<\/p>\n<p><strong>16. E se o Enzo sumir?<\/strong>\nÉ uma pergunta justa: é um projeto de uma pessoa, e isso é um risco real. O que mitiga: todo o código e os planos ficam versionados num repositório, a base guarda os documentos originais e as regras de montagem, e o método está documentado. Dar ao grupo acesso ao repositório ou um acordo de continuidade <strong>[a combinar com o grupo]<\/strong>: estou aberto a colocar isso no acordo do aporte.<\/p>\n<p><strong>17. Funciona para o meu estado (ex.: Bahia, Rio de Janeiro)?<\/strong>\nNo lançamento: federal mais SP, MG, PR, SC e RS, com as capitais e os municípios onde os escritórios do grupo têm clientes. A parte federal (IRPJ, PIS/Cofins, Simples, trabalhista federal) serve para todos. Outros estados entram como expansão, se houver demanda.<\/p>\n<p><strong>18. Quanto tempo leva para uma lei nova aparecer?<\/strong>\nA meta é menos de 24 horas entre o Diário Oficial e a base. Antes disso, a busca ao vivo encontra a norma e responde com a marca \"ainda não validada na base\".<\/p>\n<p><strong>19. Vai substituir o meu sistema contábil?<\/strong>\nNão. Não faço escrituração, guia nem obrigação acessória. É a camada de consulta e pesquisa que o sistema não tem.<\/p>\n<p><strong>20. Cobre a reforma tributária?<\/strong>\nSim. A base guarda CBS, IBS e IS convivendo ano a ano com PIS/Cofins, ICMS e ISS até 2033, e a resposta usa a regra de cada tributo na data do fato.<\/p>\n<p><strong>21. Por que o aporte paga Claude Ultra e Cursor? Isso não é ferramenta sua?<\/strong>\nSão as ferramentas que substituem uma equipe de programadores. O plano de R$ 9,3 mil deixava a assinatura do agente de fora; o aporte de R$ 20 mil põe tudo na mesa, com transparência, para não haver custo escondido.<\/p>\n<p><strong>22. Vocês disseram que não usam agentes de terceiros. Por que o servidor para OpenClaw e Hermes?<\/strong>\nExatamente por causa dos riscos documentados: eu os testo num servidor isolado, sem dados de cliente nem senhas, para saber o que aproveitar. O produto usa o nosso agente, na nossa máquina, com permissão por ação e aprovação humana.<\/p>\n<p><strong>23. Preciso instalar alguma coisa ou ter computador potente?<\/strong>\nNão. Só o navegador. O processamento acontece nos servidores.<\/p>\n<p><strong>24. E se a Anthropic ou o dólar aumentarem o preço?<\/strong>\nEstá simulado: com API 30% mais cara, a margem do Individual cai de 67,3% para 65,7%; com câmbio 10% mais caro, para 66,5%. Como a IA cara só entra no fim do funil, a variação pesa pouco.<\/p>\n<hr />", "glossario": "<p><strong>Tecnologia<\/strong><\/p>\n<ul>\n<li><strong>IA / modelo de linguagem (LLM):<\/strong> programa treinado em muito texto que entende e escreve linguagem natural.<\/li>\n<li><strong>Treino / pesos:<\/strong> a fase em que o modelo lê bilhões de textos e fixa o que aprendeu em números internos (pesos); depois disso, não aprende sozinho.<\/li>\n<li><strong>Alucinação:<\/strong> quando a IA inventa algo com cara de verdade (artigo inexistente, lei revogada).<\/li>\n<li><strong>RAG:<\/strong> buscar primeiro os trechos certos e só depois a IA redigir com base neles; a prova com consulta.<\/li>\n<li><strong>Claude (Haiku, Sonnet, Opus):<\/strong> a IA da Anthropic, em três tamanhos: barato, médio e caro.<\/li>\n<li><strong>Token:<\/strong> pedaço de palavra; a IA cobra por tokens lidos e escritos.<\/li>\n<li><strong>API:<\/strong> a \"tomada\" pela qual um programa usa outro serviço pela internet, pagando por uso.<\/li>\n<li><strong>GPU:<\/strong> placa de vídeo que roda modelos de IA; alugada por hora ou comprada.<\/li>\n<li><strong>Agente:<\/strong> IA que executa tarefas em passos (pesquisar, conferir, avisar), não só responde.<\/li>\n<li><strong>Base temporal:<\/strong> a lei guardada com todas as versões e datas; histórico de versões de um documento.<\/li>\n<li><strong>Dispositivo:<\/strong> artigo, parágrafo, inciso ou alínea, cada um guardado como unidade.<\/li>\n<li><strong>URN LexML:<\/strong> identificador nacional único de cada norma.<\/li>\n<li><strong>Akoma Ntoso:<\/strong> padrão internacional para estruturar textos legislativos.<\/li>\n<li><strong>ICLR / COLM / NeurIPS:<\/strong> conferências científicas de IA com revisão por pares; ser aceito lá é o selo de qualidade da área.<\/li>\n<li><strong>Estado da arte / experimental:<\/strong> técnica recém-publicada, à frente do que os produtos usam; aqui só entra se vencer no benchmark.<\/li>\n<li><strong>Árvore de temas (RAPTOR, 2024):<\/strong> classificação em níveis com resumos; o sumário do livro.<\/li>\n<li><strong>Cache semântico:<\/strong> reaproveitar resposta já validada para pergunta igual em outras palavras, se a lei não mudou.<\/li>\n<li><strong>Embedding:<\/strong> impressão digital numérica do significado de um texto.<\/li>\n<li><strong>Filtro de vigência:<\/strong> separar só a redação válida na data do fato; a data de validade no rótulo.<\/li>\n<li><strong>BM25:<\/strong> busca por palavras exatas que valoriza termos raros; o Ctrl+F inteligente.<\/li>\n<li><strong>doc2query:<\/strong> perguntas escritas de antemão e coladas em cada artigo, como post-its.<\/li>\n<li><strong>ColBERT (multivetorial):<\/strong> busca por significado termo a termo; o bibliotecário que entende o que você quis dizer.<\/li>\n<li><strong>LIMIT (ICLR 2026):<\/strong> estudo da Google DeepMind que provou o limite matemático de resumir cada texto num vetor único.<\/li>\n<li><strong>Grafo / PageRank (HippoRAG 2, 2025):<\/strong> rede de quem cita quem; o boca a boca entre normas.<\/li>\n<li><strong>Reranker (Rank1, 2025):<\/strong> revisor que lê ~50 candidatos, escolhe 5 a 10 e explica por quê.<\/li>\n<li><strong>Política de busca (Search-R1, 2025):<\/strong> modelo pequeno que decide buscar mais ou parar; o GPS que aprende atalhos.<\/li>\n<li><strong>Aprendizado por reforço (RL):<\/strong> treino por nota no resultado, como estágio com avaliação.<\/li>\n<li><strong>DGM (Darwin Gödel Machine):<\/strong> seleção natural aplicada ao código do agente; cada nova versão só fica se provar resultado (Zhang, Hu, Lu, Lange e Clune; 2025; ICLR 2026).<\/li>\n<li><strong>SWE-bench:<\/strong> prova padronizada de agentes de programação com problemas reais de software; onde a DGM foi de 20% para 50%.<\/li>\n<li><strong>Chave (feature flag):<\/strong> interruptor que liga ou desliga uma técnica sem mexer no resto do sistema.<\/li>\n<li><strong>Benchmark:<\/strong> prova padronizada com gabarito, montada pelos contadores do grupo.<\/li>\n<li><strong>Conjunto reservado:<\/strong> parte da prova (20%) que o sistema nunca vê; decide o portão final.<\/li>\n<li><strong>Abstenção:<\/strong> responder \"não encontrei base legal\" em vez de inventar.<\/li>\n<li><strong>Cálculo determinístico:<\/strong> conta feita por programa comum; mesma entrada, mesmo resultado.<\/li>\n<li><strong>Ingestão:<\/strong> transformar a lei publicada em fichas organizadas na base.<\/li>\n<li><strong>Congelamento do esquema:<\/strong> fixar o formato das fichas depois de testado; o plano de contas antes de lançar.<\/li>\n<li><strong>Coletor:<\/strong> programa que visita as fontes e só traz o que é novo; o office boy.<\/li>\n<li><strong>Hash:<\/strong> impressão digital de um arquivo; muda se uma vírgula mudar.<\/li>\n<li><strong>OCR:<\/strong> leitura de texto em imagem ou PDF escaneado.<\/li>\n<li><strong>robots.txt:<\/strong> aviso do site dizendo o que robôs podem visitar.<\/li>\n<li><strong>CAPTCHA:<\/strong> o \"não sou um robô\"; exige uma pessoa.<\/li>\n<li><strong>Humano no circuito:<\/strong> uma pessoa resolve a etapa que exige gente, pelo celular, como autorizar um Pix.<\/li>\n<li><strong>Busca ao vivo (MCP):<\/strong> consulta direta às fontes oficiais quando a base ainda não tem a norma.<\/li>\n<li><strong>Produção:<\/strong> o sistema que os clientes usam de verdade.<\/li>\n<li><strong>Alfa / beta:<\/strong> primeira versão crua / versão quase pronta para grupo fechado.<\/li>\n<li><strong>Playtester:<\/strong> quem usa durante o desenvolvimento e aponta os erros.<\/li>\n<li><strong>Servidor dedicado / VPS:<\/strong> computador alugado num datacenter, inteiro ou em fatia.<\/li>\n<li><strong>Colocation:<\/strong> sua máquina hospedada num datacenter de terceiros.<\/li>\n<li><strong>RunPod / Hetzner:<\/strong> empresas que alugam GPU e servidores.<\/li>\n<li><strong>Voyage:<\/strong> empresa que fornece o serviço de embedding.<\/li>\n<li><strong>Claude Ultra:<\/strong> plano de assinatura do Claude usado como agente de programação (antigo Max 20x).<\/li>\n<li><strong>Cursor:<\/strong> editor de código com agentes de IA.<\/li>\n<li><strong>OpenClaw / Hermes / Grok Bot:<\/strong> agentes de terceiros; testados só em ambiente isolado.<\/li>\n<li><strong>Payback:<\/strong> tempo para a economia devolver o investimento.<\/li>\n<li><strong>Breakeven:<\/strong> ponto em que a receita cobre os custos.<\/li>\n<\/ul>\n<p><strong>Contabilidade, tributos e trabalho<\/strong><\/p>\n<ul>\n<li><strong>Data do fato:<\/strong> data do fato gerador; define qual regra vale.<\/li>\n<li><strong>Decadência:<\/strong> prazo de 5 anos para o fisco lançar o tributo.<\/li>\n<li><strong>Multa de ofício:<\/strong> 75% do tributo quando o fisco descobre a falta (Lei 9.430, art. 44, I).<\/li>\n<li><strong>Selic:<\/strong> taxa básica de juros, usada nos juros de mora federais.<\/li>\n<li><strong>Simples Nacional:<\/strong> regime unificado da LC 123/2006, com guia única (DAS), até R$ 4,8 mi/ano.<\/li>\n<li><strong>Anexos do Simples:<\/strong> tabelas de alíquota por atividade (I comércio, II indústria, III a V serviços).<\/li>\n<li><strong>Fator R:<\/strong> folha de 12 meses ÷ receita de 12 meses; ≥ 28% leva certas atividades ao Anexo III.<\/li>\n<li><strong>RBT12:<\/strong> receita bruta dos últimos 12 meses.<\/li>\n<li><strong>Alíquota efetiva:<\/strong> (RBT12 × alíquota − parcela a deduzir) ÷ RBT12.<\/li>\n<li><strong>CGSN:<\/strong> Comitê Gestor do Simples Nacional, que edita resoluções.<\/li>\n<li><strong>MEI:<\/strong> microempreendedor individual (LC 123, art. 18-A).<\/li>\n<li><strong>Lucro Presumido:<\/strong> regime em que o lucro tributável é um percentual fixo da receita.<\/li>\n<li><strong>Pró-labore:<\/strong> remuneração do sócio pelo trabalho; entra no fator R.<\/li>\n<li><strong>ICMS / ISS:<\/strong> imposto estadual sobre mercadorias e alguns serviços / imposto municipal sobre serviços.<\/li>\n<li><strong>ICMS-ST / MVA:<\/strong> substituição tributária / margem de valor agregado usada no cálculo.<\/li>\n<li><strong>RICMS:<\/strong> regulamento do ICMS de cada estado.<\/li>\n<li><strong>CONFAZ:<\/strong> conselho dos estados que aprova convênios de ICMS.<\/li>\n<li><strong>Sefaz:<\/strong> secretaria estadual da fazenda.<\/li>\n<li><strong>CBS / IBS / IS:<\/strong> contribuição federal que substitui PIS/Cofins / imposto de estados e municípios que substitui ICMS e ISS / imposto seletivo.<\/li>\n<li><strong>EC 132/2023 e LC 214/2025:<\/strong> emenda da reforma tributária e sua lei complementar.<\/li>\n<li><strong>IN (instrução normativa):<\/strong> norma da Receita que detalha a lei.<\/li>\n<li><strong>Solução de Consulta COSIT:<\/strong> resposta oficial da Receita a dúvida de contribuinte; orienta a fiscalização.<\/li>\n<li><strong>CARF:<\/strong> tribunal administrativo federal que julga recursos contra autuações.<\/li>\n<li><strong>Acórdão:<\/strong> decisão de um tribunal colegiado.<\/li>\n<li><strong>NBC TG / CPC:<\/strong> normas brasileiras de contabilidade.<\/li>\n<li><strong>Vigência / eficácia:<\/strong> quando a norma passa a valer / quando passa a produzir efeito.<\/li>\n<li><strong>Revogação tácita:<\/strong> lei nova contradiz a antiga sem citá-la.<\/li>\n<li><strong>Remissão:<\/strong> quando um artigo manda ler outro (\"conforme o art. X\").<\/li>\n<li><strong>Retificação:<\/strong> republicação para corrigir erro do texto.<\/li>\n<li><strong>Convenção coletiva (CCT) / acordo coletivo (ACT):<\/strong> acordo entre sindicatos de empregados e patronal / entre sindicato e empresa.<\/li>\n<li><strong>Data-base:<\/strong> mês de renegociação anual da categoria.<\/li>\n<li><strong>Mediador (MTE):<\/strong> sistema onde as convenções são depositadas (CLT, art. 614).<\/li>\n<li><strong>Junta Comercial:<\/strong> órgão estadual de registro de empresas.<\/li>\n<li><strong>DREI:<\/strong> órgão federal que normatiza as Juntas.<\/li>\n<li><strong>eSocial:<\/strong> escrituração digital das obrigações trabalhistas e previdenciárias.<\/li>\n<li><strong>SPED (EFD, ECD, ECF):<\/strong> sistema de escriturações digitais fiscais e contábeis.<\/li>\n<li><strong>NF-e / NFS-e:<\/strong> nota fiscal eletrônica de mercadorias / de serviços.<\/li>\n<li><strong>NCM / CFOP / CNAE:<\/strong> código da mercadoria / da operação fiscal / da atividade econômica.<\/li>\n<li><strong>e-CAC:<\/strong> portal da Receita acessado com certificado digital.<\/li>\n<li><strong>e-CNPJ:<\/strong> certificado digital da empresa.<\/li>\n<li><strong>Serviço importado:<\/strong> pagamento ao exterior que, via CNPJ, atrai IRRF, CIDE, CBS/IBS, ISS e IOF.<\/li>\n<li><strong>IOF:<\/strong> imposto sobre operações financeiras; 3,5% no cartão internacional.<\/li>\n<li><strong>PTAX:<\/strong> taxa de câmbio oficial do Banco Central.<\/li>\n<li><strong>LGPD / ANPD:<\/strong> lei de proteção de dados / autoridade que a fiscaliza.<\/li>\n<li><strong>Cláusulas-padrão da ANPD:<\/strong> modelo de contrato para enviar dados ao exterior.<\/li>\n<li><strong>LAI:<\/strong> Lei de Acesso à Informação (12.527/2011).<\/li>\n<li><strong>Amostragem de auditoria:<\/strong> conferir uma amostra sorteada, dirigida ao risco, para medir o erro do todo.<\/li>\n<\/ul>", "slides": [{"n": 1, "titulo": "A lei certa, na data certa", "secao": "Abertura", "tempo": "0:50", "curta": "0:35", "cliques": 0, "fala": "<p><em>(as três linhas sobem sozinhas; espere a terceira acender antes de falar)<\/em> <span class=\"mk mk-pausa\">PAUSA<\/span><\/p>\n<p class=\"chave\">Boa noite. <strong>Eu sou o Enzo Vasconcelos. Sou desenvolvedor. Não sou contador.<\/strong> <span class=\"mk mk-pausa\">PAUSA<\/span> <strong>E é exatamente por isso que estou aqui: vocês são os especialistas; eu construo a ferramenta.<\/strong><\/p>\n<p>Uma cena que todo mundo aqui conhece. O cliente liga. Faz uma pergunta. Você sabe que a resposta existe. Mas em qual lei? Em qual redação? Já mudou? Aí começa a peregrinação: Planalto, Receita, Sefaz, um parecer antigo, o grupo de WhatsApp.<\/p>\n<p class=\"chave\"><strong>Hoje eu vou mostrar como encurtar esse caminho.<\/strong> Não com uma IA que \"acha\". <strong>Com uma IA que responde pela lei que valia na data do fato e mostra, artigo por artigo, onde está escrito.<\/strong> <span class=\"mk mk-pausa\">PAUSA<\/span> Essas três linhas são a apresentação inteira. O resto é como fazer isso de verdade.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>\"Data do fato\" é a data em que aconteceu o fato gerador (a venda, o serviço, o pagamento da folha). A regra que vale é a daquela data, não a de hoje. Todo contador trabalha com isso, mas nenhuma ferramenta de busca comum separa as redações por data.<\/p>"}, {"n": 2, "titulo": "549.576 profissionais", "secao": "Abertura", "tempo": "0:40", "curta": "0:25", "cliques": 1, "fala": "<p><em>(deixe o número subir sem falar)<\/em> <span class=\"mk mk-pausa\">PAUSA<\/span><\/p>\n<p class=\"chave\"><strong>549.576.<\/strong> <span class=\"mk mk-pausa\">PAUSA<\/span> <strong>É o número de profissionais da contabilidade registrados no Brasil, em outubro deste ano.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\">E cerca de 102 mil organizações contábeis. Mais da metade com 1 a 9 pessoas. Ou seja: o escritório de vocês. O dono que também é o especialista que pesquisa. <strong>Eu não quero fazer escrituração, guia nem obrigação acessória. O sistema contábil já faz isso. Quero devolver o tempo que vocês gastam pesquisando e interpretando. O tempo mais caro do escritório.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>O sistema CFC/CRCs é o conselho federal e os conselhos regionais de contabilidade; o registro no CRC é o que permite assinar como contador. \"Obrigação acessória\" é tudo o que a empresa entrega ao fisco além de pagar o tributo (declarações, escriturações digitais). Isso é trabalho do ERP contábil, não nosso.<\/p>\n<hr />"}, {"n": 3, "titulo": "A regra muda toda semana", "secao": "O problema", "tempo": "1:00", "curta": "0:30", "cliques": 1, "fala": "<p><em>(as folhas caem e o número sobe até ~550)<\/em><\/p>\n<p class=\"chave\"><strong>Na nossa estimativa: cerca de 550 atos normativos novos por mês. Só nas fontes que importam para tributação.<\/strong> <span class=\"mk mk-pausa\">PAUSA<\/span> Leis, decretos, instruções normativas, resoluções. E por trás deles, dezenas de milhares de publicações em diário oficial que alguém precisa triar.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\">Mas acompanhar não é o único problema. Chega a fiscalização, ou vocês revisam um período, e a pergunta muda: <strong>qual regra valia naquela data?<\/strong> A decadência é de cinco anos. Vocês precisam da redação de 2021, de 2022. Não a de hoje. <strong>Pesquisar no Google é olhar o mapa de hoje para saber como era a cidade dez anos atrás.<\/strong> Ele quase sempre mostra a redação atual.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Decadência é o prazo que o fisco tem para lançar (cobrar) um tributo: em regra, 5 anos (CTN, arts. 150, § 4º, e 173). Por isso uma fiscalização em 2026 pode olhar fatos de 2021. Os ~550 atos/mês são estimativa própria (pesquisa 02, § 6.4); diga sempre \"na nossa estimativa\".<\/p>"}, {"n": 4, "titulo": "Dois sistemas até 2033", "secao": "O problema", "tempo": "1:20", "curta": "0:30", "cliques": 4, "fala": "<p class=\"chave\">E por cima de tudo isso: a reforma tributária. Emenda 132, Lei Complementar 214. <strong>Em cima, em cinza, o que existe hoje. Embaixo, o que entra.<\/strong><\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 1<\/span> 2026: CBS e IBS só destacados na nota, em teste. 0,9% e 0,1%.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 2<\/span> 2027: a CBS entra para valer. PIS e Cofins acabam. Corte seco. E começa o Imposto Seletivo.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 3<\/span> De 2029 a 2032, ISS e ICMS descem: 90, 80, 70, 60%. O IBS sobe na mesma medida.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 4<\/span> 2033: só IBS e CBS.<\/p>\n<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> <strong>Uma pergunta sobre 2030 tem uma parte respondida pelo ICMS e outra pelo IBS. Quem responde com \"a lei atual\" erra metade.<\/strong> Sete anos com dois livros de regras abertos na mesa.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>CBS (Contribuição sobre Bens e Serviços) é federal e substitui PIS e Cofins. IBS (Imposto sobre Bens e Serviços) é de estados e municípios e substitui ICMS (estadual) e ISS (municipal). IS (Imposto Seletivo) incide sobre produtos prejudiciais à saúde ou ao meio ambiente. EC 132/2023 é a emenda da reforma; LC 214/2025 a regulamenta.<\/p>"}, {"n": 5, "titulo": "O preço de um erro", "secao": "O problema", "tempo": "0:50", "curta": "0:25", "cliques": 1, "fala": "<p class=\"chave\">Essa conta vocês conhecem melhor do que eu. <em>(a coluna se monta)<\/em> Tributo não recolhido, fiscalização encontra: vem o tributo, <strong>mais 75% de multa de ofício, mais juros pela Selic.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> E tem um custo que não aparece no auto de infração: <strong>o cliente que perde a confiança no escritório.<\/strong> Então tudo o que eu vou mostrar gira em torno de uma ideia. <strong>Uma resposta errada dita com confiança é pior do que nenhuma resposta.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Multa de ofício é a aplicada quando o fisco descobre a falta (não quando o contribuinte confessa): 75% do tributo (Lei 9.430/1996, art. 44, I). Juros de mora pela taxa Selic (art. 61, § 3º). \"Auto de infração\" é o documento da autuação.<\/p>"}, {"n": 6, "titulo": "Por que a IA genérica erra", "secao": "O problema", "tempo": "1:20", "curta": "0:35", "cliques": 2, "fala": "<p class=\"chave\"><em>(o 78% sobe sozinho)<\/em> <strong>78%.<\/strong> <span class=\"mk mk-pausa\">PAUSA<\/span> <strong>É quanto dos contadores já usa IA pelo menos uma vez por semana, segundo a IOB com a Fenacon e o CFC, deste ano.<\/strong> 53% todo dia. E 62% dizem que o próprio conhecimento de IA é básico. Vocês já usam. Só não sabem bem onde ela tropeça.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>Olhem essa resposta de um chat genérico. Fluente. Segura. Bem escrita. O ChatGPT aprendeu lendo a internet até uma certa data. Não sabe qual redação valia em 2022. Mistura lei antiga com lei nova. E, quando não sabe, escreve um artigo que parece verdadeiro.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> <strong>Lei revogada. Artigo inventado.<\/strong> O Decreto 3.000 foi revogado em 2018, e aquele parágrafo não existe. <strong>Ele não foi feito para dizer \"não sei\".<\/strong> O balão é ilustrativo, mas são exatamente esses dois erros que eu quero eliminar.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>O Decreto 3.000/1999 era o antigo Regulamento do Imposto de Renda (RIR/1999), substituído pelo Decreto 9.580/2018 (RIR/2018). Um contador experiente percebe o erro na hora; um estagiário pode copiar e colar. \"Alucinação\" é o nome técnico para quando a IA inventa algo com cara de verdade.<\/p>\n<hr />"}, {"n": 7, "titulo": "18 produtos, uma receita", "secao": "Mercado e concorrentes", "tempo": "1:00", "curta": "0:20", "cliques": 1, "fala": "<p>Antes de construir, olhei o mercado inteiro. <em>(os cartões caem e se organizam)<\/em> Editoras: IOB, Econet, Thomson Reuters. IA dentro do sistema contábil: Domínio, Questor, Makro, Alterdata. Startups tributárias. O chatbot da Receita. Duas IAs do mundo jurídico.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><strong>18 produtos. Uma receita só: pegam o modelo de IA de outra empresa, OpenAI, Google ou IBM, e colocam em cima do acervo próprio.<\/strong> O diferencial anunciado é o acervo e a curadoria humana. <span class=\"mk mk-pausa\">PAUSA<\/span> E quase ninguém mede precisão em público. A exceção é a Questor: 66% de respostas avaliadas como úteis. Uma startup diz 95%, sem dizer como mediu.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>\"Acervo\" aqui é a coleção de legislação, artigos e pareceres que a editora mantém. \"Curadoria humana\" é gente revisando esse material. Não é ruim; só não resolve sozinho o problema da data e da citação conferida.<\/p>"}, {"n": 8, "titulo": "Quanto se paga hoje", "secao": "Mercado e concorrentes", "tempo": "1:00", "curta": "0:20", "cliques": 1, "fala": "<p>Quanto se paga hoje. <em>(os preços entram do mais barato ao mais caro)<\/em> Receita e Makro: grátis. Jus IA: de R$ 78,90, com 30 mensagens, a R$ 208,90 no ilimitado. ChatGPT Plus: R$ 99,90. A IA do Portal da Reforma: R$ 199 por mês, e só fala da reforma.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> <strong>A leitura é simples. O profissional já paga entre R$ 79 e R$ 250 por mês. O que falta não é preço. É poder confiar na resposta sem refazer a pesquisa.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Preços por usuário, por mês, coletados entre setembro e outubro de 2026 (pesquisa 05). Vale guardar: o profissional já paga por consulta; a discussão não é \"se\" paga, é \"pelo quê\".<\/p>"}, {"n": 9, "titulo": "O espaço vazio", "secao": "Mercado e concorrentes", "tempo": "1:00", "curta": "0:20", "cliques": 1, "fala": "<p>Comparando o que cada grupo divulga, aparece um espaço vazio. <em>(as colunas se preenchem)<\/em> Responder pela redação válida numa data passada? Ninguém descreve; todos falam em \"legislação vigente\". Conferir a citação antes de entregar? Ninguém. Publicar precisão? Quase ninguém. Melhoria medida a cada ciclo? Ninguém.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><strong>A nossa coluna: um \"sim\" em cada linha.<\/strong> <span class=\"mk mk-pausa\">PAUSA<\/span> Uma ressalva honesta: \"não divulgado\" não quer dizer que não exista. Mas, se existe, ninguém está mostrando. <strong>E mostrar é parte do nosso produto.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Esta tabela compara o que é público, não o que cada empresa tem internamente. Se alguém da plateia usa um desses produtos e diz \"o meu faz isso\", a resposta certa é: \"Ótimo, então me mostre como mede; é isso que eu quero publicar no nosso.\"<\/p>\n<hr />"}, {"n": 10, "titulo": "Em uma frase", "secao": "A solução", "tempo": "1:00", "curta": "0:30", "cliques": 0, "fala": "<p><em>(a frase se escreve sozinha; leia junto, sem pressa)<\/em><\/p>\n<p class=\"chave\"><strong>Uma frase: um consultor de IA que responde pela lei vigente na data do fato, prova cada afirmação e melhora a cada ciclo.<\/strong> Tributário, contábil, trabalhista e societário.<\/p>\n<p class=\"chave\">Um detalhe que parece técnico. É o centro de tudo. <span class=\"mk mk-pausa\">PAUSA<\/span> <strong>A lei não fica decorada dentro da IA. Fica numa base de dados organizada no tempo, que dá para auditar. A IA só raciocina em cima dela.<\/strong> Um consultor brilhante que nunca responde de memória: sempre abre o código na página certa.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Isso se chama RAG (recuperação + geração), explicado no slide 13. O nome do projeto, DGM-RAG-Contábil, vem daí: RAG mais DGM, a melhoria contínua dos slides 15 e 36.<\/p>"}, {"n": 11, "titulo": "Uma pergunta real", "secao": "A solução", "tempo": "1:00", "curta": "0:30", "cliques": 1, "fala": "<p class=\"chave\">Um caso do dia a dia. <em>(a pergunta é digitada; espere terminar)<\/em> <strong>\"Meu cliente desenvolve software, está no Simples. Em março de 2022 faturava R$ 12 mil por mês e tinha folha de R$ 3 mil. Ele estava no anexo certo?\"<\/strong><\/p>\n<p>Três coisas. Uma data no passado. Uma conta, o fator R. E ninguém falou \"fator R\" nem \"Anexo V\": falou do jeito que se fala no escritório.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><strong>Primeiro passo: entender. Tema, regime, data do fato, atividade. Antes de pesquisar qualquer coisa.<\/strong> Se faltasse um dado que muda a resposta, ele perguntaria de volta. Como um bom sênior pergunta ao estagiário: \"qual UF?\".<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Simples Nacional (LC 123/2006) é o regime unificado para empresas com receita de até R$ 4,8 milhões por ano: paga-se tudo numa guia só, o DAS. As atividades são divididas em cinco anexos, cada um com sua tabela de alíquotas (I comércio, II indústria, III a V serviços). Software pode cair no Anexo III (mais barato) ou no V (mais caro), dependendo do fator R.<\/p>"}, {"n": 12, "titulo": "A resposta, montada", "secao": "A solução", "tempo": "1:30", "curta": "0:30", "cliques": 4, "fala": "<p class=\"chave\">A resposta começa pelo que interessa. <strong>Anexo V. 15,5% na primeira faixa.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\">O porquê. Folha de 12 meses, R$ 36 mil. Receita de 12 meses, R$ 144 mil. Dá 25%. Abaixo dos 28% do Anexo III. <span class=\"mk mk-pausa\">PAUSA<\/span> <strong>E essa conta não foi feita pela IA. Foi feita por uma calculadora, com a tabela daquela data. A IA só explica.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p>As citações. Lei Complementar 123, artigo 18, com o selo: vigente em março de 2022...<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p>...e a Resolução CGSN 140, também conferida. Existe, valia na data e diz o que a resposta afirma.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 4<\/span><\/p>\n<p class=\"chave\">E a dica de planejamento: <strong>com R$ 3.360 de folha, o cliente ia para o Anexo III. 6%.<\/strong> <span class=\"mk mk-pausa\">PAUSA<\/span> <strong>A resposta, a conta, a prova e a dica. Em segundos.<\/strong> Esse exemplo foi conferido, mas quem valida são vocês.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Fator R = folha de salários dos últimos 12 meses (inclui pró-labore e encargos como CPP e FGTS) ÷ receita bruta dos últimos 12 meses. Se ≥ 28%, certas atividades de serviço vão para o Anexo III; se &lt; 28%, para o Anexo V (LC 123, art. 18, §§ 5º-D e 5º-M). 28% de R$ 12 mil = R$ 3.360. CGSN é o Comitê Gestor do Simples Nacional, que regulamenta o regime por resoluções.<\/p>\n<hr />"}, {"n": 13, "titulo": "Prova com consulta (RAG)", "secao": "O que há de novo", "tempo": "1:40", "curta": "0:45", "cliques": 4, "fala": "<p class=\"chave\">Como isso funciona por dentro? A primeira novidade tem um nome em inglês: RAG. Geração aumentada por recuperação. Esqueçam o nome. <strong>Pensem numa prova.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><em>(entra o quadro \"IA comum, sem consulta\")<\/em> <strong>A IA comum faz prova sem consulta.<\/strong> Responde do que leu no treino, meses ou anos atrás. Não lembra? Chuta, com cara de certeza: \"acho que era assim\". E se a lei mudou depois do treino, ela simplesmente não sabe. É o estagiário que decorou o RIR de 1999 e nunca soube que saiu um novo em 2018.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\"><em>(entra o quadro \"RAG, com consulta\"; o livro da LC 123 sai da estante)<\/em> <strong>O RAG faz prova com consulta. Primeiro acha a página certa nos livros oficiais. Depois responde, citando a página.<\/strong> Na nossa pergunta do fator R: ele puxa a LC 123, abre no artigo 18 e só então escreve.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> E aqui está a vantagem que muda o jogo. <strong>A lei fica fora do modelo. Saiu uma norma nova hoje? Atualizamos a base. A resposta de amanhã já sai atualizada. Sem retreinar nada.<\/strong> O jeito de hoje: esperar a próxima versão do ChatGPT. O nosso jeito: atualizar a estante.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 4<\/span><\/p>\n<p class=\"chave\"><strong>É a prova com consulta: acerta quem sabe achar a página.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>RAG = Retrieval-Augmented Generation (Lewis et al., NeurIPS 2020). \"Treino\" é quando o modelo lê bilhões de textos e fixa o que aprendeu nos seus \"pesos\" (os números internos); depois disso, não aprende mais nada sozinho. \"Retreinar\" é caro e lento. Por isso a lei fica na base (Camada 1) e o modelo só lê os trechos que a busca entrega.<\/p>"}, {"n": 14, "titulo": "Técnicas 2024–2026", "secao": "O que há de novo", "tempo": "1:40", "curta": "0:45", "cliques": 3, "fala": "<p class=\"chave\"><strong>Só que lei não é um livro qualquer.<\/strong> O RAG comum procura o trecho mais parecido com a pergunta. Com legislação, isso não basta.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><em>(entram as quatro armadilhas)<\/em> <strong>Quatro armadilhas.<\/strong> Uma: <strong>versões.<\/strong> O mesmo artigo teve três redações; o RAG comum traz a mais parecida, não a que valia em março de 2022. Duas: <strong>revogações.<\/strong> O texto revogado continua lá, idêntico, e continua aparecendo na busca. Três: <strong>remissões.<\/strong> \"Observado o art. X da Lei Y\": a resposta está em outra norma, e o RAG comum não segue o fio. Quatro: <strong>vocabulário.<\/strong> O cliente pergunta \"posso pagar menos?\"; o artigo do fator R fala em \"folha de salários\" e \"receita bruta\". Nenhuma palavra em comum.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\"><em>(a linha do tempo se desenha: 2024, 2025, 2026)<\/em> Para cada armadilha, uma técnica. <strong>E todas publicadas nos últimos dois anos.<\/strong> RAPTOR, 2024: organiza a lei numa árvore de temas, como o sumário de um livro. HippoRAG 2, 2025: segue a rede de remissões num passo só. Rank1, 2025: um revisor que raciocina sobre cada trecho e anota o porquê. Search-R1, 2025: aprende, por tentativa e nota, quando vale buscar de novo. E o LIMIT, da Google DeepMind, no ICLR de 2026: provou que resumir cada trecho num número só tem limite matemático. Por isso a nossa busca por significado é multivetorial. <span class=\"mk mk-pausa\">PAUSA<\/span> Daqui a pouco vocês veem cada uma trabalhando na nossa pergunta.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p class=\"chave\"><strong>Quando eu digo \"experimental\", leiam \"estado da arte\". Saiu agora dos laboratórios. Quase nenhum produto usa.<\/strong> Os 18 concorrentes que eu mostrei? Nenhum descreve isso.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Fontes: Sarthi et al., ICLR 2024 (RAPTOR); Gutiérrez et al., 2025 (HippoRAG 2); Weller et al., COLM 2025 (Rank1); Jin et al., 2025 (Search-R1); Weller et al., ICLR 2026 (LIMIT). ICLR e COLM são conferências científicas de IA com revisão por pares: ser aceito lá é o selo de qualidade da área. O filtro de vigência, que resolve versões e revogações, é decisão de projeto, não artigo científico. Mapa armadilha → solução: versões e revogações → filtro de vigência (slide 27); remissões → grafo (slide 30); vocabulário → doc2query e busca multivetorial (slides 28 e 29); excesso de candidatos → revisor (slide 31); buscar demais → política de busca (slide 32).<\/p>"}, {"n": 15, "titulo": "Darwin Gödel Machine", "secao": "O que há de novo", "tempo": "1:50", "curta": "0:55", "cliques": 5, "fala": "<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> <strong>E tem mais uma coisa.<\/strong> <span class=\"mk mk-pausa\">PAUSA<\/span><\/p>\n<p class=\"chave\"><em>(o título \"Um sistema que evolui sozinho\" se escreve; aparece o v0 na base da árvore)<\/em> <strong>Um sistema que evolui sozinho.<\/strong> Chama-se Darwin Gödel Machine. DGM. Publicada em 2025 por Zhang, Hu, Lu, Lange e Clune, da Universidade da Colúmbia Britânica, do Vector Institute e da Sakana AI. Aceita no ICLR de 2026. <strong>A ideia em uma linha: seleção natural aplicada ao código do agente.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><em>(entra o ciclo de quatro passos e a primeira geração: v1, um ✕ vermelho e v2)<\/em> <strong>Cada nova versão faz quatro coisas. Lê os próprios erros. Propõe uma mudança em si mesma. Faz a prova. Funcionou? Entra no arquivo.<\/strong> Não funcionou? Fica de fora, como esse ✕ vermelho. E a prova, no nosso caso, é o benchmark: as perguntas reais de vocês, com gabarito. Exemplo de escritório: o sistema errou três perguntas de ICMS-ST porque não seguiu a remissão até o convênio. A versão nova propõe \"siga a remissão um nível mais fundo\". Refaz a prova. Acertou mais? Fica.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\"><em>(a árvore cresce até o v8, no alto; aparece \"o grande salto veio de uma linha fraca\")<\/em> Reparem na árvore. As versões fracas não vão para o lixo. Ficam guardadas. <strong>E o grande salto, lá em cima, veio justamente de uma linha fraca.<\/strong> É a parte Darwin: diversidade primeiro, seleção depois.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p class=\"chave\"><em>(20% vira 50%)<\/em> O resultado no artigo. Um agente de programação, numa prova padronizada de problemas reais de software, o SWE-bench. <strong>De 20% de acerto para 50%.<\/strong> <span class=\"mk mk-pausa\">PAUSA<\/span> <strong>Sozinho.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 4<\/span><\/p>\n<p class=\"chave\">Por que isso importa para vocês? <strong>Melhorar sem retreinar o modelo e sem um time de engenheiros.<\/strong> A lei muda toda semana, as perguntas de vocês mudam; o sistema acompanha. E repare: a lei nunca entra no modelo. <strong>O que evolui é o jeito de pesquisar e responder.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 5<\/span><\/p>\n<p class=\"chave\"><strong>É Darwin no escritório: muitas tentativas, só fica o que prova resultado.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Fonte: Zhang, Hu, Lu, Lange e Clune, \"Darwin Gödel Machine\" (arXiv 2505.22954; ICLR 2026). \"Gödel\" homenageia uma ideia teórica antiga de máquina que se reescreve; \"Darwin\" é a evolução por arquivo de versões. O que a DGM pode mudar no nosso agente: estratégia de busca, até onde seguir remissões, quanto contexto montar, instruções de cada especialista, a verificação de citações, quando consultar fontes ao vivo. O que ela NÃO muda: base legal, cálculos e regras de segurança. A árvore do slide é ilustrativa. O próprio artigo relata que a DGM tentou \"burlar a prova\"; a resposta a isso está no slide seguinte. Se perguntarem do exemplo do ICMS-ST: é ilustrativo, para mostrar o tipo de mudança.<\/p>"}, {"n": 16, "titulo": "Rede de proteção", "secao": "O que há de novo", "tempo": "1:20", "curta": "0:35", "cliques": 4, "fala": "<p class=\"chave\">Agora, a pergunta que vocês estão pensando. \"Experimental? No meu escritório? Com a minha assinatura?\" <span class=\"mk mk-pausa\">PAUSA<\/span> <strong>Experimental, sim. Com rede de proteção.<\/strong> Toda novidade entra como experimento, cercada por quatro garantias.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><em>(a chave liga)<\/em> <strong>Um: só entra se vencer.<\/strong> Cada técnica disputa no benchmark contra o jeito que já funciona. Perdeu? Fica desligada por uma chave. O sistema segue com o método clássico, e o custo não muda.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\"><em>(o cadeado fecha)<\/em> <strong>Dois: lei e cálculos são intocáveis.<\/strong> A DGM não mexe na base legal nem na calculadora do fator R. Isso fica fora da área que ela pode editar.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p class=\"chave\"><strong>Três: aprovação humana.<\/strong> Nenhuma versão nova vai ao ar sem uma pessoa aprovar. É como procedimento novo no escritório: só vale com a assinatura do responsável.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 4<\/span><\/p>\n<p class=\"chave\"><em>(a rede se desenha embaixo)<\/em> <strong>Quatro: cada resposta continua com a citação conferida, artigo por artigo.<\/strong> <span class=\"mk mk-pausa\">PAUSA<\/span> Ou seja: no pior caso, a novidade não entra. No melhor caso, ela entra e vocês ganham. <strong>É por isso que, aqui, experimental é vantagem, não risco.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Fonte: Plano do Assistente, Camada 4 (\"O que ela não muda\") e \"Riscos e salvaguardas\"; Plano MVP: \"Se um componente não vencer no benchmark, ele entra no lançamento desligado por chave, e o custo dele não muda.\" Contra a DGM \"burlar a prova\": métrica que pune erro e omissão, auditoria humana por amostra, área editável restrita, conjunto reservado que ela nunca vê, execução isolada e a versão anterior pronta para voltar.<\/p>\n<hr />"}, {"n": 17, "titulo": "Quatro camadas", "secao": "Arquitetura em 4 camadas", "tempo": "1:10", "curta": "0:30", "cliques": 4, "fala": "<p class=\"chave\">Agora a casa inteira. Quatro camadas. <strong>Pensem num escritório bem organizado.<\/strong><\/p>\n<p class=\"chave\"><span class=\"mk mk-clique\">CLIQUE 1<\/span> <strong>Camada 1: a biblioteca.<\/strong> Toda a legislação, com todas as versões e datas.<\/p>\n<p class=\"chave\"><span class=\"mk mk-clique\">CLIQUE 2<\/span> <strong>Camada 2: o consultor sênior.<\/strong> Recebe a pergunta, pesquisa, confere e responde. É com ele que vocês conversam.<\/p>\n<p class=\"chave\"><span class=\"mk mk-clique\">CLIQUE 3<\/span> <strong>Camada 3: o estagiário que corre ao Diário Oficial<\/strong> quando falta algo na biblioteca. O que ele traz entra no acervo.<\/p>\n<p class=\"chave\"><span class=\"mk mk-clique\">CLIQUE 4<\/span> <strong>Camada 4: a reunião semanal de qualidade. É aqui que mora a DGM.<\/strong> <span class=\"mk mk-pausa\">PAUSA<\/span> E ela fica fora da produção: só volta para o sistema uma versão aprovada por uma pessoa.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>\"Produção\" é o sistema que os clientes estão usando de verdade, em oposição ao ambiente de testes. A regra é a mesma de um escritório: procedimento novo só vale depois que o responsável aprova.<\/p>"}, {"n": 18, "titulo": "Camada 1: versões", "secao": "Arquitetura em 4 camadas", "tempo": "1:10", "curta": "0:25", "cliques": 4, "fala": "<p>O jeito de hoje: cortar a lei em blocos de tamanho fixo. Como rasgar páginas de um livro ao acaso. Vejam os cortes vermelhos: um parágrafo pela metade, separado do caput.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><strong>O nosso jeito: guardar a lei como vocês a leem. Artigo, parágrafo, inciso, alínea.<\/strong> Cada um, uma unidade inteira.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\">Cada dispositivo tem um identificador nacional que não muda e <strong>a lista de todas as redações que já teve:<\/strong> publicação, início e fim da vigência e a norma que causou a mudança.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p class=\"chave\"><strong>Toda consulta carrega uma data.<\/strong> O contador não informou? Usamos a de hoje e avisamos.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 4<\/span><\/p>\n<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> <strong>É o histórico de versões de um documento: a foto da lei em cada data.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Caput é a \"cabeça\" do artigo; depois vêm parágrafos (§), incisos (I, II…) e alíneas (a, b…). O identificador vem do LexML, o portal oficial que dá um código único (URN) a cada norma brasileira. \"Vigência\" é quando a regra passa a valer; nem sempre coincide com a publicação. É esta estrutura que desarma as armadilhas \"versões\" e \"revogações\" do slide 14.<\/p>"}, {"n": 19, "titulo": "Camada 1: rede de normas", "secao": "Arquitetura em 4 camadas", "tempo": "1:00", "curta": "0:20", "cliques": 1, "fala": "<p class=\"chave\"><strong>Ninguém aqui responde lendo só a lei.<\/strong> Vocês olham o decreto, a instrução normativa, a solução de consulta, o que o CARF decidiu. <em>(a rede se desenha)<\/em> A base guarda essas ligações: quem altera, quem regulamenta, quem interpreta, quem julga, quem remete a quem.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\">E respeita a hierarquia das fontes, da Constituição às normas do CFC. <strong>Quando duas fontes divergem, ele aponta.<\/strong> A reforma mora aqui também: CBS, IBS e IS convivendo ano a ano com PIS/Cofins, ICMS e ISS, até 2033.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Solução de Consulta COSIT: resposta formal da Receita (Coordenação-Geral de Tributação) a uma dúvida de contribuinte; orienta toda a fiscalização. CARF: o tribunal administrativo federal que julga recursos contra autuações; suas decisões são \"acórdãos\". IN: instrução normativa, norma interna da Receita que detalha a lei. NBC TG/CPC: normas contábeis. Esta rede é a matéria-prima do grafo do slide 30.<\/p>"}, {"n": 20, "titulo": "Camada 2: o agente", "secao": "Arquitetura em 4 camadas", "tempo": "1:00", "curta": "0:20", "cliques": 2, "fala": "<p class=\"chave\">O agente. A parte com que vocês conversam. <strong>Um sênior com método.<\/strong> <em>(as estações acendem)<\/em> Primeiro entende: tema, data do fato, regime, UF, município, atividade. Falta a UF numa pergunta de ICMS? Ele pergunta, em vez de supor.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>Depois encaminha para o especialista certo. São sete: federal, ICMS, ISS, trabalhista, societário, contábil e reforma. Cada um com suas fontes. Pesquisa, monta a norma inteira na redação da data, responde direto e fundamenta depois. E confere cada afirmação.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> <strong>Sem fundamento, ele diz: \"Não encontrei base legal para afirmar isso.\"<\/strong> E vocês podem cadastrar o perfil de cada cliente, para não repetir contexto toda vez.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>\"Agente\" é uma IA que não só responde, mas executa passos (pesquisar, conferir, perguntar de volta). ICMS é estadual, então a resposta muda conforme a UF; ISS é municipal, muda conforme o município. Por isso o agente pergunta antes de responder.<\/p>"}, {"n": 21, "titulo": "Camada 3: busca ao vivo", "secao": "Arquitetura em 4 camadas", "tempo": "0:40", "curta": "0:15", "cliques": 2, "fala": "<p class=\"chave\">Lei publicada hoje cedo ainda não passou pela organização. <strong>Então o agente vai direto às fontes oficiais:<\/strong> Planalto, Receita, Diário Oficial, CARF, Sefaz, CONFAZ, CFC. Internet aberta só como último recurso, e só em sites oficiais.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><strong>O que vem daí sai com link, data da consulta e a marca \"ainda não validada na base\".<\/strong> Vocês sabem o grau de confiança.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p>E o documento entra na fila de organização. A próxima pergunta já encontra o material conferido.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Sefaz: secretaria estadual da fazenda (cuida do ICMS). CONFAZ: conselho dos secretários de fazenda, que aprova convênios de ICMS entre estados. Diário Oficial da União (DOU): onde toda norma federal é publicada.<\/p>\n<hr />"}, {"n": 22, "titulo": "Cascata: do barato ao caro", "secao": "A cascata de recuperação", "tempo": "1:00", "curta": "0:25", "cliques": 3, "fala": "<p class=\"chave\">O coração técnico. Prometo: simples. <strong>A base vai ter, na nossa estimativa, cerca de 2 milhões de dispositivos. O agente nunca lê tudo.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>Cada pergunta passa por um funil. Sete etapas.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\"><strong>As seis primeiras: programas, índices e modelos pequenos. Rápidos e baratos. O Claude, a IA que cobra por leitura, entra uma vez só, no fim, e lê só de 5 a 10 trechos.<\/strong> <span class=\"mk mk-pausa\">PAUSA<\/span> É a triagem de um pronto-socorro: recepção, enfermagem e exames resolvem quase tudo, e o especialista caro só vê o caso já preparado.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p>Faltou algo? O funil volta e busca de novo. Quem decide é uma política treinada. Já chego nela.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>\"Dispositivo\" = cada artigo, parágrafo, inciso ou alínea. Claude é o modelo de IA da Anthropic que usamos para entender e redigir; cobra pelo volume de texto lido e escrito (medido em \"tokens\", pedaços de palavra). Quanto menos texto ele lê, mais barata a pergunta.<\/p>"}, {"n": 23, "titulo": "Quem faz o quê", "secao": "A cascata de recuperação", "tempo": "1:10", "curta": "0:20", "cliques": 3, "fala": "<p class=\"chave\">Três cores daqui em diante. <strong>Azul: o Claude, pela internet. Violeta: modelos abertos que são nossos, numa placa de vídeo alugada. Verde: código comum e banco de dados, sem IA.<\/strong> Nada roda no computador de vocês. Só o navegador.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>O funil colorido. O azul só aparece nas pontas: entender e redigir. Na redação, o Haiku, o mais barato, faz a maioria. O Sonnet entra nas difíceis, cerca de 9%. O Opus, cerca de 1%. O meio é todo violeta e verde.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p>Quem decide buscar de novo ou parar: uma política pequena, também nossa.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> <strong>E antes de sair: citação conferida por código, letra a letra, contra o texto oficial. E toda conta, fator R, alíquota, prazo, feita por código. Nunca pela IA de cabeça.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>API: a \"tomada\" pela qual um programa usa o serviço de outro pela internet, pagando por uso. GPU: placa de vídeo usada para rodar modelos de IA. Haiku, Sonnet e Opus são três tamanhos do Claude: pequeno e barato, médio, grande e caro. Ter modelos próprios (violeta) é o que permite treiná-los com os nossos dados, o que não dá para fazer com o Claude.<\/p>"}, {"n": 24, "titulo": "Fora da hora da pergunta", "secao": "A cascata de recuperação", "tempo": "0:40", "curta": "0:15", "cliques": 2, "fala": "<p>Duas coisas acontecem fora da hora da pergunta. Sem ninguém esperando.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><strong>Um: a organização da lei.<\/strong> Norma nova? O Haiku, em lote, extrai artigo, versão e datas. Dois extratores discordam? Só aí o Sonnet desempata. Validar é código, com regras fixas.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\"><strong>Dois: a melhoria contínua. A DGM propõe variações do método, cada uma faz a prova com as perguntas de vocês, e nenhuma entra sem aprovação humana.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>\"Em lote\" significa mandar muitos documentos de uma vez para processar sem pressa, o que sai mais barato. \"Ingestão\" é o nome técnico para pegar a lei publicada e transformá-la em fichas organizadas na base.<\/p>"}, {"n": 25, "titulo": "1 · Árvore de temas", "secao": "A cascata de recuperação", "tempo": "1:00", "curta": "0:20", "cliques": 3, "fala": "<p class=\"chave\">Etapa um: de que assunto estamos falando? <strong>Uma árvore de temas que segue a lógica de vocês. Simples Nacional, depois anexos, depois fator R.<\/strong> Cada ramo com um resumo do que contém. A técnica se chama RAPTOR, de 2024: agrupa trechos parecidos, resume o grupo, agrupa os resumos, e repete, até formar a árvore. Nós guiamos essa árvore pela classificação contábil.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p><em>(a pergunta desce pelos ramos e para em \"Fator R\")<\/em> A nossa pergunta desce e para em \"Fator R\".<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\">O jeito de hoje: jogar a pergunta no acervo inteiro e torcer. <strong>O nosso jeito: a busca já começa na estante certa.<\/strong> É isso que desarma a armadilha do vocabulário logo na porta: o cliente falou \"anexo certo\", a árvore sabe que isso é fator R. E quem faz é o Haiku, o modelo mais barato.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p class=\"chave\"><strong>É o sumário de um livro: ninguém procura o fator R folheando o livro inteiro.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>RAPTOR: Sarthi et al., ICLR 2024. MVA (que aparece no ramo de ICMS) é a margem de valor agregado usada para calcular o ICMS da substituição tributária. Taxonomia é só \"classificação em níveis\".<\/p>"}, {"n": 26, "titulo": "2 · Cache semântico", "secao": "A cascata de recuperação", "tempo": "0:50", "curta": "0:20", "cliques": 4, "fala": "<p class=\"chave\">Muitas perguntas se repetem com outras palavras. <strong>\"Qual o prazo do DAS?\" e \"até quando pago o Simples?\" são a mesma pergunta.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>O cache reconhece e puxa a resposta já validada. A pasta de pareceres aprovados do escritório.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> <strong>Mas só devolve se todas as normas citadas continuarem vigentes.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p>Alguma mudou? O parecer volta para a gaveta e a pergunta segue o funil. Um cache comum devolveria uma resposta vencida. O pior erro possível.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 4<\/span><\/p>\n<p class=\"chave\"><strong>É a resposta guardada na gaveta: antes de entregar, confere se a lei mudou.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>DAS: Documento de Arrecadação do Simples Nacional, a guia única mensal. \"Semântico\" = pelo significado, não pela letra. O sistema compara significados com um \"embedding\" (uma impressão digital numérica do sentido de um texto), fornecido pela empresa Voyage. O cache só existe quando já houver respostas validadas pelo grupo.<\/p>"}, {"n": 27, "titulo": "3 · Filtro de vigência", "secao": "A cascata de recuperação", "tempo": "0:50", "curta": "0:20", "cliques": 5, "fala": "<p>Etapa simples. E obrigatória. Antes de procurar qualquer palavra, o sistema separa só o que pode responder.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 1<\/span> A esfera certa: federal, estadual ou municipal.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 2<\/span> O tributo certo.<\/p>\n<p class=\"chave\"><span class=\"mk mk-clique\">CLIQUE 3<\/span> <strong>E, principalmente, a redação válida na data do fato.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 4<\/span><\/p>\n<p class=\"chave\">O jeito de hoje: buscar em tudo e torcer para o texto antigo não aparecer. <strong>O nosso jeito: ele nem está no caminho.<\/strong> Versões e revogações, duas das quatro armadilhas, resolvidas aqui. Pelo banco de dados. Sem IA nenhuma.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 5<\/span><\/p>\n<p class=\"chave\"><strong>É a data de validade no rótulo: o que estava vencido em março de 2022, ou ainda não valia, nem sai da prateleira.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Esferas: federal (IRPJ, CSLL, PIS, Cofins, IPI), estadual (ICMS, IPVA, ITCMD), municipal (ISS, IPTU, ITBI). \"Metadados\" são as etiquetas de cada dispositivo: esfera, tributo, datas.<\/p>"}, {"n": 28, "titulo": "4a · Palavras exatas", "secao": "A cascata de recuperação", "tempo": "0:50", "curta": "0:20", "cliques": 4, "fala": "<p>Etapa quatro: duas buscas lado a lado. A primeira, por palavras exatas. Uma técnica clássica, o BM25. Dá mais peso a termos raros. Número de lei, NCM, CFOP, sigla: nada substitui.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>Mas a lei não fala como o contador. Então, na organização, um modelo lê cada artigo e escreve as perguntas que ele responde. E cola no artigo. Como post-its.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\"><strong>\"Posso pagar menos se aumentar a folha?\" encontra o artigo do fator R. Que não tem nenhuma dessas palavras.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p>O jeito comum seria um índice separado. Aqui é um índice a menos. Na hora da pergunta, só o banco de dados trabalha.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 4<\/span><\/p>\n<p class=\"chave\"><strong>É o Ctrl+F: acha o número exato, letra por letra. E os post-its trazem as palavras do contador.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>NCM: código de classificação de mercadorias. CFOP: código fiscal da operação (venda, devolução, remessa). doc2query (Nogueira et al., 2019) é o nome da técnica de escrever de antemão as perguntas que cada artigo responde. No teste LIMIT, o BM25 se sai bem justamente onde os vetores únicos falham.<\/p>"}, {"n": 29, "titulo": "4b · Significado", "secao": "A cascata de recuperação", "tempo": "1:00", "curta": "0:20", "cliques": 3, "fala": "<p>A segunda busca: por significado.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>O jeito de hoje resume cada artigo numa única impressão digital numérica. Um número só para o artigo inteiro. Em 2026, a Google DeepMind provou que isso tem um teto matemático: há combinações de documentos que esse resumo único simplesmente não consegue achar. O teste se chama LIMIT. <span class=\"mk mk-pausa\">PAUSA<\/span> Pensem em descrever um artigo de lei inteiro com uma única palavra. Alguma coisa vai se perder.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\"><strong>O nosso jeito: cada palavra da pergunta procura seu melhor par no artigo. \"Faturamento\" encontra \"receita bruta\".<\/strong> Uma nota por termo, não uma por artigo. É um modelo pequeno, nosso, ajustado ao português jurídico. E se não ganhar do método comum nas perguntas de vocês, fica desligado.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p class=\"chave\"><strong>É um bibliotecário que entende o que você quis dizer, mesmo quando você não usa as palavras da lei.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Nome técnico: ColBERT (Khattab e Zaharia, 2020), um recuperador \"multivetorial\". O estudo que o justifica é o LIMIT (Weller et al., ICLR 2026). \"Receita bruta\" é o termo legal; \"faturamento\" é como o cliente fala. Benchmark: o conjunto de perguntas com gabarito que o grupo monta para medir tudo.<\/p>"}, {"n": 30, "titulo": "5 · Grafo de normas", "secao": "A cascata de recuperação", "tempo": "1:00", "curta": "0:20", "cliques": 5, "fala": "<p>Achados os artigos principais, falta o resto: o regulamento, a solução de consulta, o acórdão. A armadilha das remissões.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-cli
