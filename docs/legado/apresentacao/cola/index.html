que\">CLIQUE 1<\/span><\/p>\n<p>Acendem os dois artigos encontrados na etapa anterior.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\">O princípio é o do Google antigo, o PageRank. <strong>A relevância parte dos artigos encontrados e se espalha pela rede de normas.<\/strong> A técnica é o HippoRAG 2, de 2025.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p>Lei, regulamento, interpretação e julgamento. Juntos. Num passo só.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 4<\/span><\/p>\n<p class=\"chave\">O jeito de hoje: buscar de novo, rodada após rodada, seguindo cada remissão. No artigo original, o nosso caminho saiu <strong>de 10 a 30 vezes mais barato.<\/strong> <span class=\"mk mk-pausa\">PAUSA<\/span> <strong>E é conta pura. Sem IA.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 5<\/span><\/p>\n<p class=\"chave\"><strong>É quem cita quem: o boca a boca entre normas. A norma citada por normas importantes ganha peso.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>\"Remissão\" é quando um artigo manda ler outro (\"conforme o art. X\"). \"Grafo\" é só uma rede de pontos ligados. Res. CGSN 140/2018 é o regulamento do Simples. HippoRAG: Gutiérrez et al., 2024; HippoRAG 2, 2025. O \"10 a 30 vezes\" é do artigo original do HippoRAG, comparado à busca em rodadas.<\/p>"}, {"n": 31, "titulo": "6 · Revisor", "secao": "A cascata de recuperação", "tempo": "1:00", "curta": "0:20", "cliques": 4, "fala": "<p>Depois das buscas: uns 50 candidatos.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>O revisor lê cada um e anota o motivo. \"Este responde: é fator R em 2022.\" \"Este não: é sobre MEI.\"<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p>Ficam de 5 a 10. Os outros saem com o motivo registrado.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p class=\"chave\">O jeito de hoje: um reordenador dá uma nota e pronto, sem explicar. O nosso, o Rank1, de 2025, pensa antes de decidir. <span class=\"mk mk-pausa\">PAUSA<\/span> <strong>Num produto que precisa mostrar a base legal, essa justificativa é ouro: dá para auditar por que um artigo entrou e outro não.<\/strong> É um modelo nosso, e só substitui o provisório se ganhar dele nas perguntas de vocês.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 4<\/span><\/p>\n<p class=\"chave\"><strong>É o escritório de sempre: o estagiário traz 50 documentos, o sênior escolhe 5 e explica por quê.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Nome técnico: Rank1 (Weller et al., COLM 2025), um \"reranker de raciocínio\". MEI: microempreendedor individual, regime à parte (art. 18-A da LC 123). É aqui que a GPU própria mais economiza: mandar 50 artigos ao Claude a cada pergunta é o que encarece o jeito comum.<\/p>"}, {"n": 32, "titulo": "7 · Decisão de parar", "secao": "A cascata de recuperação", "tempo": "1:10", "curta": "0:20", "cliques": 5, "fala": "<p>Etapa sete. O Claude lê os poucos trechos que sobraram, sempre na redação da data, e redige.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>Às vezes falta algo. Ele pode voltar e buscar de novo.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\"><strong>Quem decide é uma pequena política de busca, treinada com nota pelo resultado.<\/strong> A técnica é o Search-R1, de 2025. Funciona como estágio com avaliação: acertou com poucas buscas, nota alta. Buscou à toa, nota menor. Errou, nota baixa. Depois de milhares de tentativas, ela aprende sozinha quando já basta.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p class=\"chave\">E segue para a resposta citada. <span class=\"mk mk-pausa\">PAUSA<\/span> <strong>Isso não muda o acerto. Reduz custo e espera.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 4<\/span><\/p>\n<p>O jeito de hoje: escrever na instrução \"se precisar, busque mais\". E a IA busca demais, ou de menos. A nossa aprende quando parar.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 5<\/span><\/p>\n<p class=\"chave\"><strong>É um GPS que aprende os atalhos e sabe quando já chegou: não fica dando voltas.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>\"Treino por reforço\" (RL): o modelo tenta, recebe uma nota e ajusta o próprio comportamento. Fonte: Jin et al., 2025 (Search-R1); continuação Search-R1++, 2026. Só dá para treinar assim um modelo que é nosso; por isso ele roda na nossa GPU. Diferença para a DGM: o RL ajusta os pesos deste modelo pequeno; a DGM ajusta o código em volta (cascata, limiares, instruções).<\/p>\n<hr />"}, {"n": 33, "titulo": "Conferido antes de chegar", "secao": "Confiança e melhoria contínua", "tempo": "1:20", "curta": "0:30", "cliques": 3, "fala": "<p class=\"chave\"><strong>A salvaguarda principal.<\/strong> <em>(a primeira citação atravessa os três portões)<\/em> Depois de redigir, uma segunda etapa pega cada afirmação e faz três perguntas. <strong>O dispositivo existe? Estava vigente na data do fato? Diz mesmo o que a resposta afirma?<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>A segunda citação passa nas duas primeiras e cai na terceira. O artigo existe, valia, mas não diz aquilo. Riscada. Afirmação sem suporte é removida ou marcada.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> Sem fundamento suficiente, a resposta é \"não encontrei base legal para afirmar isso\", com a lista do que foi pesquisado. <strong>Nunca uma invenção. A meta: 100% das respostas com citação conferida ou abstenção.<\/strong> Quem mede são vocês.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p class=\"chave\"><strong>É conferir a nota fiscal contra o pedido: item por item, antes de dar entrada no estoque.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>\"Abstenção\" = o sistema se recusa a afirmar sem prova. É o equivalente a \"o fechamento só sai quando bater\". Esta etapa é uma das que a DGM pode aprimorar, mas não pode desligar.<\/p>"}, {"n": 34, "titulo": "Conta não é opinião", "secao": "Confiança e melhoria contínua", "tempo": "1:00", "curta": "0:25", "cliques": 3, "fala": "<p class=\"chave\">IA escreve bem. Faz conta mal. E às vezes erra uma alíquota com toda a segurança. <strong>Por isso nenhuma conta passa pela IA.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>Alíquota efetiva do Simples, fator R, multa e juros pela Selic: tudo por um programa comum, com tabelas versionadas por data e os índices vindos direto do Banco Central. Exemplo: receita de R$ 300 mil em 12 meses, segunda faixa do Anexo III. Alíquota efetiva: 8,08%.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\">O número sai da calculadora e entra no balão. <span class=\"mk mk-pausa\">PAUSA<\/span> <strong>A mesma divisão de trabalho do escritório: a planilha calcula, o sênior interpreta.<\/strong> E essa parte fica trancada. A DGM não toca nela.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p class=\"chave\"><strong>Calculadora, não opinião: o mesmo número toda vez, e dá para conferir.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Alíquota efetiva do Simples = (RBT12 × alíquota nominal − parcela a deduzir) ÷ RBT12. RBT12 = receita bruta dos últimos 12 meses. No exemplo: (300.000 × 11,2% − 9.360) ÷ 300.000 = 8,08%. \"Determinístico\" = mesma entrada, sempre o mesmo resultado.<\/p>"}, {"n": 35, "titulo": "Cada correção vira prova", "secao": "Confiança e melhoria contínua", "tempo": "1:10", "curta": "0:25", "cliques": 3, "fala": "<p>A melhoria contínua começa com o botão mais simples do mundo. Correta ou incorreta. E um campo para corrigir.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\">O contador clica \"incorreta\" e escreve: \"Na data do fato valia a redação anterior.\" <strong>Esse feedback é o ativo mais valioso do produto.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p>O grupo valida e a correção vira um caso de teste: pergunta, data, resposta certa e os artigos que precisam ser citados. 20% ficam guardados e nunca são mostrados ao sistema que evolui. A prova final que o aluno não vê antes.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> <strong>A prova cresce com o uso: começa com 50 perguntas e chega a 200. Todas enviadas por vocês.<\/strong> Sem essa régua, não dá para medir nada. E a DGM não tem contra o que evoluir.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Benchmark = prova padronizada com gabarito. \"Conjunto reservado\" = parte da prova guardada a sete chaves para evitar que o sistema \"decore\" as respostas. Quando uma norma citada muda, o caso volta para revisão.<\/p>"}, {"n": 36, "titulo": "Dois laços de evolução", "secao": "Confiança e melhoria contínua", "tempo": "1:10", "curta": "0:20", "cliques": 4, "fala": "<p>Lembram da DGM? Aqui ela encontra o feedback de vocês. Dois laços de evolução.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><strong>O primeiro: a DGM, fazendo a prova com as perguntas de vocês.<\/strong> Cada versão lê os próprios erros, propõe uma melhoria, e só entra no arquivo se acertar mais. <span class=\"mk mk-pausa\">PAUSA<\/span> O próprio artigo relata que ela tenta \"burlar a prova\". É para isso que existe o conjunto reservado e a revisão humana.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\">O segundo: o treino daquele GPS da busca. Premia o acerto, penaliza cada busca extra. <strong>Os dois medidos pela mesma régua: acerto por real gasto.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p class=\"chave\"><strong>E a lei, as calculadoras e as regras de segurança ficam trancadas. Nenhum dos dois laços mexe nelas.<\/strong> Não venceu a versão de partida? Fica desligado.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 4<\/span><\/p>\n<p class=\"chave\"><strong>Uma auditoria interna: só aprova a mudança que prova resultado.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Métrica da DGM: acerto da conclusão (modelo-juiz calibrado com revisões humanas), precisão das citações, abstenção correta (pune inventar e também dizer \"não sei\" quando havia resposta) e custo/tempo como restrição. A comparação com auditoria é boa para esta plateia: \"nenhum procedimento novo entra sem evidência e sem assinatura do responsável\".<\/p>\n<hr />"}, {"n": 37, "titulo": "Por que é difícil", "secao": "Ingestão da base legal", "tempo": "1:10", "curta": "0:20", "cliques": 1, "fala": "<p class=\"chave\">Tudo isso depende de uma base confiável. <strong>E montar essa base é a parte mais difícil do projeto.<\/strong> Na nossa estimativa, dez anos de federal, cinco estados e 25 municípios: cerca de 5 milhões de atos em diários para triar. 89 mil para ler a fundo. 2 milhões de dispositivos no fim.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\">E a lei não muda de forma limpa. <span class=\"mk mk-pausa\">PAUSA<\/span> Vocês sabem. Um artigo entra em vigor numa data, outro noventa dias depois. Sai uma retificação. Uma lei revoga outra sem dizer qual. Um único ato altera dez normas. O efeito depende de um regulamento que ainda não saiu. <strong>E compilação de editora tem direito autoral. Só usamos a fonte oficial.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>\"Vigência diferida\": parte da lei vale numa data, parte noutra. \"Revogação por incompatibilidade\" (tácita): a lei nova contradiz a antiga sem citá-la. Retificação: republicação para corrigir erro do texto publicado.<\/p>"}, {"n": 38, "titulo": "De onde vêm os dados", "secao": "Ingestão da base legal", "tempo": "0:50", "curta": "0:15", "cliques": 1, "fala": "<p class=\"chave\">De onde vem a informação. <strong>Fontes oficiais. Quase todas gratuitas.<\/strong> Federal: o Diário Oficial completo em formato de dados, grátis desde 2020; o Planalto com os textos compilados; o LexML com o identificador de cada norma; Receita, CARF, CONFAZ e tribunais superiores. Cada estado: Sefaz, diário oficial, Assembleia, tribunal administrativo. Municípios: diário oficial e o projeto Querido Diário.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>Um exemplo de como o escopo cabe: em Minas, 834 dos 853 municípios publicam no mesmo diário. Um coletor cobre o estado quase inteiro.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>INLABS: serviço da Imprensa Nacional que entrega o DOU em XML (formato de dados). Querido Diário: projeto aberto que reúne diários municipais. Editoras pagas servem só para conferência manual.<\/p>"}, {"n": 39, "titulo": "Sindicatos, Juntas e manuais", "secao": "Ingestão da base legal", "tempo": "1:00", "curta": "0:15", "cliques": 2, "fala": "<p class=\"chave\"><strong>Contador não vive só de lei tributária.<\/strong> A folha depende da convenção coletiva. A abertura de empresa, da Junta. O dia a dia, dos manuais. Tudo isso entra. Convenções e acordos, no Mediador do Ministério do Trabalho, onde são depositados. Registro empresarial: lei, decreto, instruções do DREI e as cinco Juntas do nosso escopo. Manuais: eSocial, SPED, NF-e, o Perguntas e Respostas da Receita, FGTS.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>Como achar a convenção certa: da atividade do cliente para a categoria, da categoria para o sindicato da base territorial, daí para a convenção.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p><span class=\"mk mk-pausa\">PAUSA<\/span> E a convenção também tem tempo: vigência, data-base, aditivos. Como na lei, vale a foto da data do fato. No lançamento, entram as categorias dos clientes de vocês; as demais, por demanda.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Convenção coletiva (CCT): acordo entre sindicato dos empregados e sindicato patronal (piso, reajuste, adicionais); acordo coletivo (ACT) é com uma empresa. Data-base: mês em que a categoria renegocia. CLT, art. 614: depósito no MTE (sistema Mediador). DREI: órgão federal que normatiza as Juntas Comerciais (registro de empresas, estadual). eSocial: escrituração trabalhista e previdenciária; SPED: escriturações digitais fiscais e contábeis (EFD, ECD, ECF). A forma de acesso ao Mediador ainda está sendo conferida.<\/p>"}, {"n": 40, "titulo": "O coletor", "secao": "Ingestão da base legal", "tempo": "1:10", "curta": "0:20", "cliques": 7, "fala": "<p class=\"chave\"><strong>Para sindicatos e Juntas: um coletor. Um programa comum e barato que visita, compara e só chama a IA no fim.<\/strong><\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 1<\/span> Uma vez, cadastramos as páginas de publicação de cada sindicato e Junta. Depois, visitas agendadas: órgãos e Juntas todo dia, sindicatos uma ou duas vezes por semana. Sem login, respeitando as regras de cada site.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 2<\/span> \"Mudou?\" é respondido sem IA: compara a impressão digital do arquivo. Nada mudou, nada mais é feito. Custo quase zero.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 3<\/span> Só o documento novo vai à IA, que classifica tipo, categoria e vigência.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 4<\/span> Página sumiu ou mudou de lugar? Vai para um painel de fontes quebradas. A IA tenta reencontrar; se não conseguir, eu corrijo.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 5<\/span> O que só circula no WhatsApp chega por vocês, por e-mail ou upload, com registro de quem enviou.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 6<\/span> Documento pago ou restrito: versão oficial gratuita; pedido pela Lei de Acesso à Informação; licença com o sindicato ou a editora; e, se nada der, mostramos o dado com a citação e o link, sem republicar o documento.<\/p>\n<p class=\"chave\"><span class=\"mk mk-clique\">CLIQUE 7<\/span> <strong>Um office boy que passa nos órgãos todo dia e só traz o que é novo.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>\"Hash\" é a impressão digital de um arquivo: muda se uma vírgula mudar. \"robots.txt\" é o aviso do site dizendo o que robôs podem visitar. LAI: Lei 12.527/2011; vale para órgãos públicos (o MTE), não para sindicatos, que são entidades privadas. Certidões vendidas pelas Juntas não entram: não são norma e têm dados pessoais.<\/p>"}, {"n": 41, "titulo": "Quatro princípios", "secao": "Ingestão da base legal", "tempo": "0:50", "curta": "0:15", "cliques": 4, "fala": "<p>Quatro regras que não mudam nunca.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 1<\/span> Um: o original nunca muda. Guardado como veio, com impressão digital, endereço e data da coleta.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 2<\/span> Dois: cada versão tem três datas, publicação, vigência e eficácia, mais a data em que entrou na base.<\/p>\n<p class=\"chave\"><span class=\"mk mk-clique\">CLIQUE 3<\/span> <strong>Três: a IA não escreve o texto consolidado. Só registra eventos, \"este ato deu nova redação a este parágrafo\", e um programa aplica os eventos em ordem. Como lançamento contábil: o saldo não se digita. Se apura.<\/strong><\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 4<\/span> Quatro: toda informação aponta para o trecho exato do original que a justifica.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Vigência = quando a norma existe e vale; eficácia = quando produz efeito (pode depender de regulamento ou de anterioridade tributária, os 90 dias/exercício seguinte). \"Texto consolidado\" = a lei com todas as alterações já incorporadas.<\/p>"}, {"n": 42, "titulo": "Uma equipe de agentes", "secao": "Ingestão da base legal", "tempo": "1:00", "curta": "0:15", "cliques": 7, "fala": "<p class=\"chave\"><strong>Quem faz esse trabalho não é uma equipe grande de pessoas. Sou eu, com uma equipe de agentes.<\/strong> No topo, o orquestrador: fila, prioridades, orçamento.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 1<\/span> O coletor baixa e guarda o original; o normalizador extrai o texto; o triador descarta o que não interessa.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 2<\/span> Dois extratores, com IAs de empresas diferentes, às cegas, preenchem as fichas sem ver o trabalho um do outro. Dois auditores que não conversam antes de entregar. Um validador aplica regras automáticas.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 3<\/span> Um revisor compara com casos-modelo. Divergiu? Um reconciliador tenta resolver; não conseguiu, fila humana.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 4<\/span> Um programa consolida, um conferente compara com o texto oficial. Só vai para produção o que passa nos quatro portões.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 5<\/span> Ao lado: o auditor amostral, o controlador de custos e o mantenedor dos coletores.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 6<\/span> Vejam um documento percorrendo o caminho: se divide nos dois extratores e se reencontra no validador.<\/p>\n<p class=\"chave\"><span class=\"mk mk-clique\">CLIQUE 7<\/span> <strong>Um escritório com setores: cada um faz a sua parte, com conferência no meio.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Os quatro portões: validador sem falhas, extratores concordando, revisor aprovando, conferência com o texto oficial. É segregação de funções, conceito que vocês usam em controle interno: quem prepara não é quem confere.<\/p>"}, {"n": 43, "titulo": "Medir antes de congelar", "secao": "Ingestão da base legal", "tempo": "0:50", "curta": "0:15", "cliques": 4, "fala": "<p class=\"chave\">Antes de organizar milhões de dispositivos, preciso fixar o formato das fichas. <strong>E quem valida são vocês.<\/strong> <em>(aparece a amostra)<\/em> 300 documentos variados, com 20 casos difíceis de propósito.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>Vocês preenchem 60 à mão; os agentes, os 300. Caso que não cabe nos campos vira proposta de mudança.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p>Meta: 98% de concordância entre agentes e profissionais.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p><span class=\"mk mk-pausa\">PAUSA<\/span> Só congelamos depois de duas rodadas seguidas, com 100 documentos novos cada, sem nenhuma mudança. Acertar de primeira não se adivinha. Se testa.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 4<\/span><\/p>\n<p class=\"chave\"><strong>Como definir o plano de contas antes de lançar: depois de congelado, não se mexe.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>\"Esquema\" = o formato das fichas (quais campos, que tipo de dado). Partimos de padrões que já existem: LexML e Akoma Ntoso (padrão internacional para textos legislativos). Dúvidas de vigência vão ao advogado do grupo.<\/p>"}, {"n": 44, "titulo": "Em ondas", "secao": "Ingestão da base legal", "tempo": "0:40", "curta": "0:15", "cliques": 4, "fala": "<p>A base cresce em ondas.<\/p>\n<p class=\"chave\"><span class=\"mk mk-clique\">CLIQUE 1<\/span> <strong>Primeiro, o federal. Vale para todos.<\/strong><\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 2<\/span> Depois São Paulo e Minas; depois Paraná, Santa Catarina e Rio Grande do Sul. Cada estado com o regulamento do ICMS, as tabelas de substituição tributária, as respostas a consultas da Sefaz e as decisões do tribunal administrativo. Um estado só segue depois de passar na auditoria.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 3<\/span> Junto com o Sul, os municípios: capitais e onde os escritórios de vocês têm clientes. Os demais, por demanda.<\/p>\n<p class=\"chave\"><span class=\"mk mk-clique\">CLIQUE 4<\/span> <strong>Os últimos dez anos. Cobrem com folga a decadência de cinco.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>RICMS: regulamento do ICMS de cada estado. Substituição tributária (ST): um contribuinte da cadeia recolhe o ICMS pelos seguintes. Sem contar SC, os estados do escopo somam cerca de 286 mil profissionais, mais da metade do país. Se o slide mostrar os meses, não os leia: diga só a ordem.<\/p>"}, {"n": 45, "titulo": "Confiança em números", "secao": "Ingestão da base legal", "tempo": "0:50", "curta": "0:20", "cliques": 4, "fala": "<p class=\"chave\"><strong>Como saber se a base está certa? Amostragem.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>Sorteamos 100 dispositivos e vocês conferem cada um contra o texto oficial. Vocês são playtesters. E auditores.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p>Certo ou errado, um por um: taxa de erro medida, não estimada. A amostra se concentra onde o risco é maior: vigência complexa, retificações, tabelas.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> <strong>O critério: no máximo 2% de erro nas cinco UFs. E menos de 24 horas entre o Diário Oficial e a base.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 4<\/span><\/p>\n<p class=\"chave\"><strong>A mesma amostragem de auditoria que vocês já fazem.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>É a lógica da NBC TA de amostragem: amostra dirigida ao risco, erro projetado para a população. Cada erro encontrado vira um novo caso-modelo ou uma nova regra no validador.<\/p>"}, {"n": 46, "titulo": "Quando a porta está fechada", "secao": "Ingestão da base legal", "tempo": "0:50", "curta": "0:15", "cliques": 6, "fala": "<p>Algumas fontes têm barreira. Até o Planalto bloqueou nossa coleta automática durante a pesquisa. Então temos uma escada.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 1<\/span> Degrau um: serviço oficial de dados. INLABS, LexML, Querido Diário.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 2<\/span> Dois: o mesmo ato em outro veículo oficial. O convênio também sai no DOU.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 3<\/span> Três: Lei de Acesso à Informação. Gratuito, sem justificar, resposta em até 20 dias, prorrogáveis por 10.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 4<\/span> Quatro: ofício ou convênio com a Sefaz, o tribunal ou a prefeitura.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 5<\/span> Cinco: licença paga, quando a compilação é protegida.<\/p>\n<p class=\"chave\"><span class=\"mk mk-clique\">CLIQUE 6<\/span> <span class=\"mk mk-pausa\">PAUSA<\/span> <strong>E o último degrau é uma pessoa.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>LAI, art. 8º, § 3º, III: os órgãos devem permitir acesso automatizado em formato legível por máquina. CAPTCHA: o \"não sou um robô\" dos sites; existe justamente para exigir uma pessoa. Não tentamos burlar; uma pessoa resolve.<\/p>"}, {"n": 47, "titulo": "Humano no circuito", "secao": "Ingestão da base legal", "tempo": "0:50", "curta": "0:15", "cliques": 7, "fala": "<p class=\"chave\"><strong>O CAPTCHA é resolvido sempre por uma pessoa. Mas ela não precisa sentar no computador.<\/strong><\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 1<\/span> O coletor está baixando os atos de uma Junta e esbarra num CAPTCHA. Pausa e chama uma pessoa.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 2<\/span> Chega um aviso com um link: no painel, no Telegram, no Discord ou no WhatsApp.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 3<\/span> O link abre a página ao vivo no celular. O navegador roda no nosso servidor; o celular só mostra a tela. Nenhuma senha, nenhum arquivo passa pelo celular.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 4<\/span> A pessoa resolve. Um toque, ou as imagens. Segundos.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 5<\/span> A IA continua de onde parou.<\/p>\n<p><span class=\"mk mk-clique\">CLIQUE 6<\/span> Link de uso único, expira em minutos, tudo registrado. Custo perto de zero.<\/p>\n<p class=\"chave\"><span class=\"mk mk-clique\">CLIQUE 7<\/span> <strong>Como autorizar um Pix pelo app.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>\"Sessão\" = o login temporário que o site concede depois do CAPTCHA; fica no servidor e serve para os demais documentos daquela fonte. \"Headless\" = navegador que roda sem tela, no servidor.<\/p>\n<hr />"}, {"n": 48, "titulo": "Agêntico por padrão", "secao": "Visão agêntica e diferenciais", "tempo": "1:20", "curta": "0:35", "cliques": 4, "fala": "<p class=\"chave\">Para onde isso vai. <strong>O futuro não é um chat que responde. É um time de agentes trabalhando para o contador.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>Um vigia da lei, que cruza cada norma nova com a atividade, o regime e o estado de cada cliente, e avisa: \"isto muda para a empresa X\". Um agente de prazos. Um que prepara rascunhos de respostas e cálculos para você revisar e assinar. E os coletores, dia e noite.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p>E o agente é nosso. Código aberto, hospedado e controlado por nós, na mesma GPU do plano.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> <strong>As travas são de engenharia: cada ação precisa de permissão própria; certificado digital, e-CAC ou envio ao cliente esperam a aprovação de uma pessoa; o agente roda isolado; tudo fica registrado.<\/strong> A lista de tarefas que vocês querem delegar é o que define os primeiros agentes.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 4<\/span><\/p>\n<p class=\"chave\"><strong>Uma equipe de assistentes trabalhando enquanto você atende o cliente.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>e-CAC: portal da Receita onde se acessa a situação fiscal da empresa, com certificado digital. Agentes de terceiros como OpenClaw, Hermes e Grok Bot tiveram falhas documentadas (instâncias expostas, acesso às contas do usuário). No desenvolvimento, eu os testo só num ambiente isolado (a VPS do aporte), nunca com dados de cliente.<\/p>"}, {"n": 49, "titulo": "Seis diferenciais", "secao": "Visão agêntica e diferenciais", "tempo": "1:10", "curta": "0:25", "cliques": 1, "fala": "<p class=\"chave\">Seis. <em>(acendem um a um)<\/em> <strong>Data do fato:<\/strong> pergunta sobre 2022, regra de 2022. <strong>Citação conferida<\/strong> antes de chegar a vocês. <strong>Várias normas num passo:<\/strong> lei, decreto, IN, convenção, Junta. <strong>Precisão publicada<\/strong>, num mercado em que quase ninguém publica. <strong>Time de agentes<\/strong>, não só chat. <strong>E o \"não sei\" honesto<\/strong> em vez de inventar. <span class=\"mk mk-pausa\">PAUSA<\/span> Nenhum dos 18 concorrentes que olhei descreve os seis juntos.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>E custo baixo por desenho: o modelo caro só lê o que importa. Já mostro os números.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Se alguém perguntar \"qual é o principal?\", responda: data do fato com citação conferida. É o que nenhum produto contábil consultado descreve.<\/p>\n<hr />"}, {"n": 50, "titulo": "Dados dos clientes", "secao": "Segurança, LGPD e responsabilidade", "tempo": "1:00", "curta": "0:30", "cliques": 1, "fala": "<p class=\"chave\">Na pesquisa da Fenacon, a maior preocupação dos contadores com IA é vazamento de dados de clientes: 33%. <strong>Os dados de cada escritório ficam cifrados e isolados dos outros, com registro de quem acessou. Nunca são usados para treinar modelos. Termos de uso e LGPD prontos antes de qualquer cobrança.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> E sendo transparente: a pergunta precisa ir ao modelo de IA, que roda fora do país. <strong>É transferência internacional, coberta pelas cláusulas-padrão da ANPD, e o fornecedor não guarda nem treina com ela.<\/strong> Quando a GPU for nossa, ela fica num datacenter em São Paulo. E nenhum dado de cliente entra nas perguntas de teste sem anonimização.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>LGPD: Lei Geral de Proteção de Dados (Lei 13.709/2018). ANPD: a autoridade que fiscaliza. \"Cláusulas-padrão contratuais\" são o modelo de contrato aprovado pela ANPD para enviar dados a outro país. \"Cifrado\" = criptografado: ilegível sem a chave.<\/p>"}, {"n": 51, "titulo": "Quem assina", "secao": "Segurança, LGPD e responsabilidade", "tempo": "1:00", "curta": "0:30", "cliques": 1, "fala": "<p class=\"chave\">Uma posição clara. <span class=\"mk mk-pausa\">PAUSA<\/span> <strong>Isto é um assistente. Não substitui o contador nem o advogado. A decisão e a assinatura são de quem tem CRC.<\/strong> <em>(deixe a assinatura se desenhar)<\/em><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>Toda resposta cita a fonte e a data de vigência, e registramos qual versão da base gerou cada uma, para reconstruir depois se alguém questionar. Publicamos a taxa de erro medida, em vez de prometer \"100% correto\". E seguro de responsabilidade profissional e auditoria humana por amostra entram no custo a partir de 500 usuários.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>O contador responde pelo trabalho que assina (Código de Ética do CFC e responsabilidade civil). O produto reforça isso, não tira: mostra a prova para o contador decidir. Seguro E&amp;O = seguro de erros e omissões profissionais.<\/p>\n<hr />"}, {"n": 52, "titulo": "Seis meses", "secao": "Plano e investimento", "tempo": "1:10", "curta": "0:35", "cliques": 2, "fala": "<p><em>(os meses entram um a um; deixe a tela falar, não leia a grade)<\/em><\/p>\n<p class=\"chave\"><strong>Seis meses. Uma pessoa. A arquitetura inteira.<\/strong> Eu, trabalhando com agentes de programação, sem equipe contratada. A ordem é por risco: primeiro a lei com todas as versões e a citação conferida. Depois a busca completa e os estados. Depois a inteligência que aprende: a política de busca e a DGM. No fim, o portão: congela, corrige, liga a cobrança.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><strong>E vocês, desde o primeiro dia.<\/strong> Mandando perguntas com gabarito, usando o alfa, marcando erros, até usar como se já estivesse lançado.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\"><strong>Lançamento comercial no mês 7.<\/strong> <span class=\"mk mk-pausa\">PAUSA<\/span> Por que cabe em seis meses? Três motivos. Cinco estados, não o país inteiro. Textos oficiais digitais, sem papel escaneado. E agentes de programação fazendo o trabalho de vários programadores.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Alfa: primeira versão de uso, crua, para poucos. Beta: quase pronta, para um grupo fechado. Playtester: quem usa e aponta defeitos durante o desenvolvimento. \"Portão\" final: as 7 etapas, a política, a DGM e a busca ao vivo em produção, com acerto acima da meta do grupo no conjunto reservado. Se alguém pedir o detalhe mês a mês, está na tela e em docs/Plano_MVP_6_meses.md; responda apontando a tela, sem recitar.<\/p>"}, {"n": 53, "titulo": "Investimento", "secao": "Plano e investimento", "tempo": "1:10", "curta": "0:35", "cliques": 2, "fala": "<p class=\"chave\">Quanto custa o desenvolvimento em si. <strong>Na conta base: R$ 15,6 mil em seis meses.<\/strong> A barra mostra para onde vai: IA para ler e organizar a lei, GPU alugada por hora, testes, servidor e os ciclos de melhoria. A linha tracejada é o teto de referência: R$ 10 mil.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><strong>Com as alavancas: R$ 9,3 mil. Dentro do teto.<\/strong> As principais: pagar tudo no cartão de pessoa física e abrir o CNPJ só no fim do desenvolvimento; um servidor no Brasil, cobrado em reais; a DGM usando a própria assinatura do agente de programação; GPU mais barata; e os termos revisados pelo advogado do grupo.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\">Quem financia são vocês, os playtesters: durante o desenvolvimento não há preço nem receita. Tem limite mensal de gasto, alerta e uma ordem de corte combinada. <span class=\"mk mk-pausa\">PAUSA<\/span> <strong>Este número não inclui as ferramentas com que eu construo. No último slide eu mostro o aporte completo, com tudo dentro.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Ordem de corte, se o dinheiro apertar: 1º o terceiro ciclo da DGM, 2º a segunda rodada de treino da política, 3º o doc2query completo. Faixa da base: R$ 9 mil a R$ 27,4 mil; com alavancas: R$ 5,6 mil a R$ 15,9 mil (são estimativas).<\/p>"}, {"n": 54, "titulo": "Tributos sobre o dólar", "secao": "Plano e investimento", "tempo": "1:10", "curta": "0:30", "cliques": 2, "fala": "<p class=\"chave\">Algo que vocês conhecem bem: serviço importado. IA, GPU e servidor são cobrados em dólar ou euro. Câmbio do dia: cerca de R$ 5,49. <strong>No cartão de pessoa física, com IOF de 3,5%: R$ 5,69 por dólar.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><strong>Com CNPJ, entram IRRF, CIDE, CBS e IBS, ISS e IOF: R$ 7,97 por dólar.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> <strong>40% a mais em tudo o que é pago lá fora. Por isso os seis meses vão no cartão de pessoa física.<\/strong> E por isso, no lançamento, todo o custo de IA já está calculado a R$ 7,97.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Importação de serviço por pessoa jurídica: IRRF retido, CIDE-remessas, tributos sobre consumo (PIS/Cofins-importação, em transição para CBS/IBS), ISS sobre importação e IOF-câmbio. PTAX: taxa de câmbio oficial do Banco Central. Aqui a plateia sabe mais que você; se alguém detalhar alíquotas, agradeça e anote.<\/p>\n<hr />"}, {"n": 55, "titulo": "GPU em três fases", "secao": "GPU e custo por pergunta", "tempo": "1:00", "curta": "0:20", "cliques": 3, "fala": "<p class=\"chave\">A GPU é a placa que roda os nossos modelos pequenos: o revisor, o GPS da busca. <strong>No desenvolvimento, só alugada por hora, ligada quando precisa: cerca de 275 horas, uns R$ 2,6 mil.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>No lançamento: servidor dedicado alugado, cerca de R$ 2,5 mil por mês com 500 usuários pagantes.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\"><strong>O ideal: GPU própria, num datacenter em São Paulo.<\/strong> R$ 40,8 mil uma vez, mais R$ 1.075 por mês. E ela roda também o nosso agente.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p class=\"chave\"><strong>Como o imóvel: aluga-se para começar, compra-se quando o uso justifica.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>RunPod e Hetzner são empresas que alugam servidores com GPU. Datacenter (colocation) = você é dono da máquina e paga para ela ficar num prédio com energia, refrigeração e segurança. É a decisão de imobilizado que vocês fazem com clientes: alugar enquanto não compensa comprar.<\/p>"}, {"n": 56, "titulo": "Comprar GPU própria", "secao": "GPU e custo por pergunta", "tempo": "1:00", "curta": "0:25", "cliques": 1, "fala": "<p class=\"chave\"><strong>Alugar para sempre não é sustentável. O aluguel cresce com a base. A máquina própria, não.<\/strong> Gasto mensal. Com 500 usuários: alugar, R$ 2.457; a própria, R$ 3.215, porque mantemos uma alugada de reserva. Não se paga. Com 3.000: se paga em 24 meses. Com 10.000: em 6.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> <strong>A regra: compramos quando a compra se paga em até 12 meses. Isso acontece por volta de 3.500 usuários pagantes.<\/strong> Sempre num datacenter em São Paulo, com um servidor alugado de reserva.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Payback = tempo para a economia mensal devolver o investimento. Depreciação em 36 meses: R$ 2.208/mês. Placa RTX 5090 a ~R$ 27,8 mil (mediana de 3 meses no gpuprix) + computador de R$ 13 mil (premissa).<\/p>"}, {"n": 57, "titulo": "Custo por pergunta", "secao": "GPU e custo por pergunta", "tempo": "1:10", "curta": "0:30", "cliques": 3, "fala": "<p class=\"chave\"><strong>O ponto que mais importa para o preço.<\/strong> O jeito de hoje: pegar uns 80 mil tokens de texto e mandar tudo para um modelo grande. No Opus, R$ 2,87 por pergunta. No Sonnet, R$ 1,43.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\">O nosso jeito: o funil filtra antes, nas nossas máquinas, e a maioria das perguntas vai para o Haiku. <strong>R$ 0,22 por pergunta. Já com a conferência das citações.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> <strong>De 6 a 13 vezes menos.<\/strong> Honestidade: os concorrentes não publicam quanto gastam; esta é a conta com a mesma tabela de preços para os dois jeitos. O nosso número é estimativa. A meta é medir até R$ 0,30 com vocês.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p class=\"chave\"><strong>Triagem antes: o processo inteiro não vai ao advogado mais caro.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Valores só de IA, já com os tributos de importação (R$ 7,97/US$). Mix estimado: Haiku na maioria, Sonnet ~9%, Opus ~1% (pesquisa 08; a medir com o grupo).<\/p>"}, {"n": 58, "titulo": "Custo total por pergunta", "secao": "GPU e custo por pergunta", "tempo": "0:50", "curta": "0:15", "cliques": 0, "fala": "<p class=\"chave\">O slide anterior era só a IA. Agora tudo: IA, GPU, servidor, melhoria contínua, seguro, auditoria, suporte, contador. <strong>50 usuários: R$ 2,69 por pergunta. 500: R$ 0,63. 3.000: R$ 0,47. 10.000: R$ 0,39.<\/strong> <span class=\"mk mk-pausa\">PAUSA<\/span> A tecnologia se dilui; a parte cinza, seguro e suporte, cresce com o número de clientes. A escala trabalhando a favor.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>É rateio de custo fixo: o servidor custa quase o mesmo para 50 ou 500 usuários, então o custo unitário cai. Não inclui tributos sobre a receita nem taxa do meio de pagamento.<\/p>\n<hr />"}, {"n": 59, "titulo": "Preço por pergunta", "secao": "Preço e escala", "tempo": "0:50", "curta": "0:20", "cliques": 2, "fala": "<p>O outro lado: preço. Quanto se paga hoje por consulta. Jus IA, plano de entrada: cerca de R$ 2,63 por mensagem. Locus.IA: R$ 2,50 por análise.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><strong>O nosso Individual: R$ 199 por 100 perguntas. R$ 1,99 cada.<\/strong> E cada pergunta é uma pesquisa fundamentada, com citação conferida e data do fato.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p><span class=\"mk mk-pausa\">PAUSA<\/span> Mesmo mais barato, sobra margem: cerca de 67% com metade da cota, 62% com a cota cheia.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Margem aqui = (preço − tributos − meio de pagamento − IA − infraestrutura rateada) ÷ preço, com 500 usuários. \"Cota\" = franquia de perguntas do plano.<\/p>"}, {"n": 60, "titulo": "Planos", "secao": "Preço e escala", "tempo": "1:00", "curta": "0:25", "cliques": 1, "fala": "<p class=\"chave\">Os planos do lançamento, com nota fiscal no CNPJ do escritório e desconto no anual. <strong>Grátis, com 10 perguntas simples por mês. Individual, R$ 199. Escritório, R$ 790, com 5 usuários e 400 perguntas: o tamanho do escritório típico.<\/strong> Corporativo, R$ 2.290. Enterprise, a partir de R$ 6.900. Margem entre 62% e 68% em todos.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p>Passou da cota? Pacote de 100 perguntas por R$ 149. <span class=\"mk mk-pausa\">PAUSA<\/span> Isso segura a conta: um plano \"ilimitado\" quebraria a margem.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Anual: Individual R$ 169, Escritório R$ 659, Corporativo R$ 1.890 por mês. O plano Grátis custa para nós R$ 0,43 por usuário/mês: é custo de aquisição de cliente (como a primeira consulta gratuita).<\/p>"}, {"n": 61, "titulo": "Ao lado do mercado", "secao": "Preço e escala", "tempo": "0:50", "curta": "0:20", "cliques": 1, "fala": "<p>Os concorrentes em cinza, por usuário e por mês. E a faixa de R$ 79 a R$ 250 que o profissional já paga.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\">Nossos planos caem dentro da régua. O Individual empata com o Portal da Reforma, que só cobre a reforma, e fica abaixo do Jus IA Premium e do Locus.IA. <strong>O Escritório sai a R$ 158 por usuário. É o plano em que eu mais quero ouvir vocês sobre preço.<\/strong> E para quem já tem IA grátis no sistema contábil: não competimos com o sistema. Somos a camada de consulta que ele não tem.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>O pacote IOB de 5 usuários sai a cerca de R$ 97 por usuário (contrato público de 2023 corrigido, estimativa): é um portal com IA acessória, não uma pesquisa com citação conferida.<\/p>"}, {"n": 62, "titulo": "Escala e equilíbrio", "secao": "Preço e escala", "tempo": "0:50", "curta": "0:25", "cliques": 1, "fala": "<p class=\"chave\"><strong>Para quem está financiando, a boa notícia: com 44 usuários pagantes, a operação se paga.<\/strong> Sem contar salário. Só o grupo de vocês pode chegar perto disso. Com 500 usuários: resultado de R$ 51 mil por mês, margem de 62%.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p><span class=\"mk mk-pausa\">PAUSA<\/span> Com um pró-labore de R$ 10 mil para mim, que ainda é premissa a confirmar, o equilíbrio vai para 137 usuários.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Breakeven (ponto de equilíbrio) operacional: receita = custos. Os cenários usam Simples (Anexo V) com 50 e 500 usuários e Lucro Presumido de 2027 com 3.000 e 10.000. Com pró-labore ≥ 28% da receita, a empresa iria para o Anexo III pelo fator R: o mesmo caso do slide 12.<\/p>\n<hr />"}, {"n": 63, "titulo": "Riscos", "secao": "Riscos, aporte e encerramento", "tempo": "1:00", "curta": "0:30", "cliques": 0, "fala": "<p class=\"chave\">O que pode dar errado. <strong>O maior risco: uma resposta errada dita com confiança. Quase toda a arquitetura existe para impedir isso: citação conferida e abstenção.<\/strong> Orçamento estourar o teto: alavancas, limite de gasto, ordem de corte. Uma técnica experimental não vencer no teste: fica desligada, sem custo extra. Convenção coletiva ter direito autoral: pergunta para o advogado do grupo; se não puder, mostramos o dado com a citação. Um agente agir fora do combinado: permissão por ação e aprovação humana. <span class=\"mk mk-pausa\">PAUSA<\/span> E uso acima da cota: franquia e pacote extra.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Lei 9.610/1998 (direitos autorais), art. 8º, IV: atos oficiais (leis, decretos, decisões) não têm proteção autoral. Falta saber se convenção coletiva, que é um acordo privado depositado no MTE, se enquadra.<\/p>"}, {"n": 64, "titulo": "Próximos passos", "secao": "Riscos, aporte e encerramento", "tempo": "2:20", "curta": "1:30", "cliques": 4, "fala": "<p>O que acontece agora.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 1<\/span><\/p>\n<p class=\"chave\"><strong>Primeiro: fechar o grupo de playtesters e o aporte. E aqui eu peço com clareza: R$ 20 mil para os seis meses, dividido entre os escritórios do grupo.<\/strong> <span class=\"mk mk-pausa\">PAUSA<\/span> Para onde vai cada real. Tudo no meu cartão de pessoa física, a R$ 5,69 por dólar, com o CNPJ aberto só no fim, como vimos.<\/p>\n<ul>\n<li class=\"chave\"><strong>R$ 6.828: o Claude Ultra<\/strong>, o antigo Max 20x, US$ 200 por mês. O agente de programação que faz o trabalho de uma equipe. Sem ele, não há seis meses.<\/li>\n<li class=\"chave\"><strong>R$ 1.024: o Cursor Premium<\/strong>, US$ 30 por mês. O editor de código com os agentes.<\/li>\n<li class=\"chave\"><strong>R$ 360: um servidor isolado<\/strong> para testar agentes abertos, como OpenClaw e Hermes, longe de qualquer dado real.<\/li>\n<li class=\"chave\"><strong>R$ 9.296: o desenvolvimento em si<\/strong>, o do slide do investimento, já com as alavancas: API, GPU por hora, servidor, domínio, e-CNPJ, termos.<\/li>\n<li class=\"chave\"><strong>R$ 2.492: uma reserva de cerca de 12%<\/strong>, porque são estimativas e o dólar oscila.<\/li>\n<\/ul>\n<p><span class=\"mk mk-pausa\">PAUSA<\/span> Uma possível folga, que ainda estou confirmando: o plano Ultra inclui US$ 200 por mês em créditos de API. Se confirmar, parte do custo de IA já está paga. Vira sobra, não gasto novo.<\/p>\n<p class=\"chave\">E além do dinheiro: <strong>50 perguntas reais do dia a dia, com a resposta certa. Uso desde o alfa, marcando erros. E a lista das tarefas repetitivas que vocês gostariam de entregar a um agente.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 2<\/span><\/p>\n<p class=\"chave\"><strong>Segundo: montar com vocês as perguntas com gabarito.<\/strong> Começa com 50 e chega a 200. É a régua de tudo. É a prova que a DGM vai fazer.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 3<\/span><\/p>\n<p>Terceiro: levar ao advogado do grupo a questão do direito autoral das convenções.<\/p>\n<p class=\"so-mk\"><span class=\"mk mk-clique\">CLIQUE 4<\/span><\/p>\n<p class=\"chave\"><strong>Quarto: começar. Pela base federal, com todas as versões.<\/strong><\/p>\n<p class=\"so-mk\"><span class=\"mk mk-avanca\">AVANÇA ›<\/span><\/p>", "entender": "<p>Soma: 6.828 + 1.024 + 360 + 9.296 + 2.492 = R$ 20.000. Conferência: US$ 200 × 6 × 5,69 = R$ 6.828; US$ 30 × 6 × 5,69 ≈ R$ 1.024. A reserva é ~12% do total (≈ 14% sobre os R$ 17.508 de custos). Os R$ 9.296 são o desenvolvimento \"com alavancas\", cuja faixa vai de R$ 5,6 mil a R$ 15,9 mil; a reserva cobre parte desse risco, não todo. O slide mostra os itens nesta mesma ordem.<\/p>"}, {"n": 65, "titulo": "Encerramento", "secao": "Riscos, aporte e encerramento", "tempo": "0:40", "curta": "0:30", "cliques": 0, "fala": "<p><em>(deixe as três linhas aparecerem)<\/em> <span class=\"mk mk-pausa\">PAUSA<\/span><\/p>\n<p class=\"chave\"><strong>Começamos com três linhas. Terminamos com elas.<\/strong><\/p>\n<p class=\"chave\"><strong>A lei certa: cada artigo guarda todas as suas versões.<\/strong><\/p>\n<p class=\"chave\"><strong>Na data certa: toda pergunta carrega a data do fato.<\/strong><\/p>\n<p class=\"chave\"><strong>Com a prova: cada citação é conferida. Sem prova, o sistema diz \"não encontrei\".<\/strong><\/p>\n<p class=\"chave\"><span class=\"mk mk-pausa\">PAUSA<\/span> <strong>Seis meses. R$ 20 mil. Vocês medindo desde o primeiro dia.<\/strong><\/p>\n<p class=\"chave\"><strong>Vocês são os especialistas. Eu construo a ferramenta. Obrigado. Agora, perguntas.<\/strong><\/p>\n<p><em>(fim; deixe o slide com \"Enzo Vasconcelos\" na tela durante as perguntas)<\/em><\/p>", "entender": "<p>Termine e fique em silêncio. A primeira pergunta demora uns segundos; não preencha o silêncio. Se ninguém perguntar, use: \"Uma pergunta que sempre me fazem é: e se a IA errar?\" (resposta 4 abaixo). Se o grupo quiser entrar, peça para falarem com você na saída.<\/p>\n<hr />"}]};
const S = D.slides;
const $ = (id) => document.getElementById(id);
const guardar = (k, v) => { try { localStorage.setItem("cola." + k, JSON.stringify(v)); } catch (e) {} };
const ler = (k, padrao) => { try { const v = localStorage.getItem("cola." + k); return v == null ? padrao : JSON.parse(v); } catch (e) { return padrao; } };
const seg = (t) => { if (!t) return 0; const [m, s] = t.split(":").map(Number); return m * 60 + (s || 0); };
const fmt = (x) => { const a = Math.abs(Math.round(x)); return Math.floor(a / 60) + ":" + String(a % 60).padStart(2, "0"); };

let i = Math.min(Math.max(ler("slide", 0), 0), S.length - 1);
let curta = ler("curta", false);
const tamanhos = [18, 21, 24, 28, 32];
let tam = ler("tam", 1);
let rodando = false, inicio = 0, acumulado = ler("acumulado", 0);

function previsto(idx) { let t = 0; for (let k = 0; k < idx; k++) t += seg(curta ? S[k].curta : S[k].tempo); return t; }

function render() {
  const s = S[i];
  $("num").innerHTML = "<b>" + s.n + "</b> / " + S.length;
  $("secao").textContent = s.secao;
  $("titulo").textContent = s.titulo;
  $("meta").innerHTML = "<span>⏱ " + (curta ? s.curta + " (curta)" : s.tempo) + "</span>" +
    (s.cliques ? '<span class="c">' + s.cliques + (s.cliques === 1 ? " clique" : " cliques") + " antes de avançar</span>" : "<span>sem cliques</span>");
  $("fala").innerHTML = s.fala;
  $("entender").hidden = !s.entender;
  $("entenderTxt").innerHTML = s.entender;
  $("entender").open = ler("entenderAberto", false);
  $("progresso").style.width = ((i + 1) / S.length * 100) + "%";
  document.body.classList.toggle("curta", curta);
  $("modo").setAttribute("aria-pressed", String(curta));
  document.documentElement.style.setProperty("--fs", tamanhos[tam] + "px");
  guardar("slide", i);
  if (location.hash !== "#s" + s.n) history.replaceState(null, "", "#s" + s.n);
  window.scrollTo(0, 0);
  relogio();
}

function ir(novo) { if (novo < 0 || novo >= S.length) return; i = novo; render(); }

function decorrido() { return acumulado + (rodando ? (Date.now() - inicio) / 1000 : 0); }
function relogio() {
  const t = decorrido();
  $("tempo").textContent = fmt(t);
  const r = $("relogio"); r.classList.toggle("parado", !rodando);
  const d = $("delta");
  if (!rodando && t === 0) { d.textContent = "toque p/ iniciar"; d.className = "d"; return; }
  const diff = t - previsto(i);
  d.textContent = (diff > 0 ? "+" : "−") + fmt(diff) + (diff > 0 ? " atrasado" : " folga");
  d.className = "d" + (diff > 30 ? " atrasado" : "");
}
setInterval(() => { if (rodando) relogio(); }, 1000);
$("relogio").addEventListener("click", () => {
  if (rodando) { acumulado = decorrido(); rodando = false; guardar("acumulado", acumulado); }
  else { inicio = Date.now(); rodando = true; manterTela(); }
  relogio();
});

$("ant").addEventListener("click", () => ir(i - 1));
$("prox").addEventListener("click", () => ir(i + 1));
$("modo").addEventListener("click", () => { curta = !curta; guardar("curta", curta); render(); });
$("fonte").addEventListener("click", () => { tam = (tam + 1) % tamanhos.length; guardar("tam", tam); render(); });
$("entender").addEventListener("toggle", () => guardar("entenderAberto", $("entender").open));
document.addEventListener("keydown", (e) => {
  if (!$("menu").hidden) { if (e.key === "Escape") fecharMenu(); return; }
  if (e.key === "ArrowRight" || e.key === "PageDown") ir(i + 1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") ir(i - 1);
});

// Deslizar para trocar de slide
let x0 = null, y0 = null;
$("palco").addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
$("palco").addEventListener("touchend", (e) => {
  if (x0 == null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) ir(i + (dx < 0 ? 1 : -1));
  x0 = null;
}, { passive: true });

// Tela acesa durante a apresentação
let trava = null;
async function manterTela() {
  try { if ("wakeLock" in navigator && !trava) { trava = await navigator.wakeLock.request("screen"); trava.addEventListener("release", () => { trava = null; }); } } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && rodando) manterTela(); });
document.addEventListener("click", manterTela, { once: true });

// Menu
let aba = "slides";
function abrirMenu(qual) { aba = qual || "slides"; $("menu").hidden = false; desenharMenu(); }
function fecharMenu() { $("menu").hidden = true; }
function embrulharTabelas(h) { return h.replace(/<table>/g, '<div class="tab"><table>').replace(/<\/table>/g, "</table></div>"); }
function desenharMenu() {
  document.querySelectorAll("[data-aba]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.aba === aba)));
  const c = $("menuCorpo");
  if (aba === "slides") {
    let h = "", sec = "";
    S.forEach((s, k) => {
      if (s.secao !== sec) { if (sec) h += "</div>"; sec = s.secao; h += '<div class="lista-secao">' + sec + '</div><div class="lista">'; }
      h += '<button data-ir="' + k + '" class="' + (k === i ? "atual" : "") + '"><span class="n">' + s.n + "</span><span>" + s.titulo + "</span></button>";
    });
    h += '</div><div class="opcoes"><button id="zerar">Zerar cronômetro</button></div>';
    c.innerHTML = h;
    c.querySelectorAll("[data-ir]").forEach((b) => b.addEventListener("click", () => { fecharMenu(); ir(Number(b.dataset.ir)); }));
    $("zerar").addEventListener("click", () => { rodando = false; acumulado = 0; guardar("acumulado", 0); relogio(); fecharMenu(); });
    const atual = c.querySelector(".atual"); if (atual) atual.scrollIntoView({ block: "center" });
  } else {
    c.innerHTML = '<div class="apoio">' + embrulharTabelas(D[aba]) + "</div>";
    c.scrollTop = 0;
  }
  if (location.hash !== "#" + aba && aba !== "slides") history.replaceState(null, "", "#" + aba);
}
$("abrirMenu").addEventListener("click", () => abrirMenu("slides"));
$("fecharMenu").addEventListener("click", () => { fecharMenu(); render(); });
document.querySelectorAll("[data-aba]").forEach((b) => b.addEventListener("click", () => { aba = b.dataset.aba; desenharMenu(); }));

function rota() {
  const h = location.hash.slice(1);
  const m = h.match(/^s(\d+)$/);
  if (m) { const k = S.findIndex((s) => s.n === Number(m[1])); if (k >= 0) { i = k; } fecharMenu(); render(); }
  else if (["inicio", "perguntas", "glossario"].includes(h)) { render(); abrirMenu(h); }
  else render();
}
window.addEventListener("hashchange", rota);
rota();
</script>
